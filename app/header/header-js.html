<script>
/* Refresh info, service unit buttons, pipeline menu, tabs */
/** "Last updated at …" = the newest successful (OK) refresh in data/refresh-log.txt (site/source.js reads it; ERROR
 *  lines are ignored); without such a line, the time the Excel file last changed. No refresh button: the page reads
 *  the data when it opens. */
function renderRefresh() {
  var s = S.source,
    when = s.refreshed || (s.updated ? fmtTs(s.updated) : '');
  document.getElementById('rf').innerHTML = when
    ? '<span title="' + esc((s.name || '') + ' · file last changed ' + fmtTs(s.updated)) + '">Last updated at <b>' + esc(when) + '</b></span>'
    : S.busy
      ? 'Loading…'
      : '';
}

/** Toggle next to the title: People pipeline (everything) / New DB (validated on or after a date).
 *  With New DB on, a small date box changes the date for this view only (not saved; the admin date is the default). */
function renderDb() {
  var d = newDbFrom();
  document.getElementById('db').innerHTML =
    '<div class="seg"><button class="' +
    (S.db === 'pipeline' ? 'on' : '') +
    '" onclick="setDb(\'pipeline\')">People pipeline</button><button class="' +
    (S.db === 'newdb' ? 'on' : '') +
    '" onclick="setDb(\'newdb\')" title="Accounts validated on or after ' +
    esc(fmtXl(newDbSerial())) +
    '">New DB</button></div>' +
    (S.db === 'newdb'
      ? '<small>validated on or after <input type="date" class="dbd" value="' +
        esc(d) +
        '" onchange="setDbFrom(this.value)" title="Change the date for this view only (not saved)">' +
        (S.dbFrom && S.dbFrom !== S.settings.newDbFrom
          ? '<button class="lnk" onclick="setDbFrom(\'\')" title="Back to the saved date ' +
            esc(S.settings.newDbFrom || '') +
            '">reset</button>'
          : '') +
        '</small>'
      : '');
}

/** New DB date for this view only ('' = back to the admin date). Nothing is saved. */
function setDbFrom(v) {
  S.dbFrom = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
  changed();
}

function setDb(db) {
  S.db = db;
  changed();
}

/** Owners of the chosen service unit(s): pick one or more; nothing picked = all owners. */
function renderOwners() {
  var box = document.getElementById('owners');
  if (!S.units.length) {
    box.innerHTML = '<span class="olbl">User</span><span class="ohint">Pick a service unit above to see its users</span>';
    box.style.display = '';
    return;
  }
  var cnt = {};
  S.acc.forEach(function (a) {
    // "Real projects only": no internal accounts, and internal users are never listed
    if (hiddenAcc(a) || (S.clean && S.px.own && INTERNAL_USERS.test(a.owner))) return;
    if (S.units.indexOf(a.su) >= 0) {
      var o = a.owner || '(none)';
      cnt[o] = (cnt[o] || 0) + 1;
    }
  });
  var list = Object.keys(cnt).sort(function (x, y) {
    return (x === '(none)') - (y === '(none)') || x.localeCompare(y);
  });
  S._owners = list;
  box.style.display = '';
  box.innerHTML =
    '<span class="olbl">User</span><button class="' +
    (S.owners.length ? '' : 'on') +
    '" onclick="setOwner(null)">All</button>' +
    list
      .map(function (o) {
        return (
          '<button class="' +
          (S.owners.indexOf(o) >= 0 ? 'on' : '') +
          '" onclick="setOwner(' +
          list.indexOf(o) +
          ')" title="' +
          cnt[o] +
          ' accounts">' +
          esc(o === '(none)' ? 'No owner' : cap(o)) +
          '</button>'
        );
      })
      .join('');
}

/** Click an owner to add / remove it (several can be picked). i = position in the owner row, null = All. */
function setOwner(i) {
  var o = i === null ? null : S._owners[i];
  if (o === null) S.owners = [];
  else {
    var i = S.owners.indexOf(o);
    if (i >= 0) S.owners.splice(i, 1);
    else S.owners.push(o);
  }
  changed();
}

function renderUnits() {
  var inGrp = {};
  GROUPS.forEach(function (g) {
    g.units.forEach(function (u) {
      inGrp[u] = 1;
    });
  });
  var ub = function (u) {
    return (
      '<button class="' +
      (S.units.indexOf(u) >= 0 ? 'on ' : '') +
      (S.have[u] ? '' : 'nodata') +
      '" onclick="setUnit(\'' +
      esc(u) +
      '\')" title="' +
      (S.have[u] || 0) +
      ' accounts">' +
      esc(unitLabel(u)) +
      '</button>'
    );
  };
  var h = '<button class="' + (S.units.length ? '' : 'on') + '" onclick="setUnit(null)">All</button>';
  GROUPS.forEach(function (g, gi) {
    var on = g.units.every(function (x) {
      return S.units.indexOf(x) >= 0;
    });
    h +=
      '<span class="ugrp"><button class="grp ' +
      (on ? 'on' : '') +
      '" onclick="setGroup(' +
      gi +
      ')">' +
      esc(g.t) +
      '</button><span class="row">' +
      g.units.map(ub).join('') +
      '</span></span>';
  });
  S.allUnits.forEach(function (u) {
    if (!inGrp[u]) h += ub(u);
  });
  h +=
    '<label class="multi" title="Tick to select several service units at once"><input type="checkbox" ' +
    (S.multiUnit ? 'checked' : '') +
    ' onchange="toggleMulti(this.checked)">multiple</label>';
  document.getElementById('units').innerHTML = h;

  var lbl = S.pipes.length
    ? S.pipes
        .slice()
        .sort()
        .map(function (k) {
          return 'Pipeline ' + k;
        })
        .join(' + ')
    : 'All pipelines';
  var p = '<button class="pbtn" onclick="S.pm=!S.pm;renderUnits()">' + esc(lbl) + ' <i>▾</i></button>';
  if (S.pm)
    p +=
      '<div class="pmenu">' +
      PIPES.map(function (x) {
        return (
          '<label><input type="checkbox" ' +
          (S.pipes.indexOf(x.k) >= 0 ? 'checked' : '') +
          ' onchange="setPipe(' +
          x.k +
          ')"><span><b>' +
          esc(x.t) +
          '</b><small>' +
          esc(x.s) +
          '</small></span></label>'
        );
      }).join('') +
      '<div class="pm-f"><button class="lnk" onclick="setPipe(null)">All pipelines</button><button class="lnk" onclick="S.pm=false;renderUnits()">Close</button></div></div>';
  // pipelines only apply to map 01 (the other maps always show every pipeline)
  document.getElementById('pipes').innerHTML = onView(1) ? '<span class="pw">' + p + '</span>' : '';

  renderNav();
}

/* ---------- levels 1 + 2: BUSINESS | NO BUSINESS, then the maps of that choice ----------
   BUSINESS    → map cards 01 Current pipeline, 06 Current demand, 02 Past pipeline, 05 Past clients; the two of a pair
                 (Current pipeline + Current demand, Past pipeline + Past clients) can be picked together: one map
   NO BUSINESS → map 03, with a card per classification (Past demand, Met in, Met out, Contacted, Not contacted):
                 click to pick one or several (S.nbCls; none = all); the map keeps its size */
var BIZ = [
  { k: 'business', t: 'Business', views: [1, 6, 2, 5], also: [16, 25] },
  { k: 'nobusiness', t: 'No business', views: [3] }
];

function bizOf(view) {
  return BIZ.filter(function (b) {
    return b.views.indexOf(view) >= 0 || (b.also || []).indexOf(view) >= 0;
  })[0];
}

// the pairs that can be shown together, and the combined map of each (MAPS[16], MAPS[25] in matrix/maps-js)
var MAP_PAIR = { 1: 6, 6: 1, 2: 5, 5: 2 };
var MAP_COMBO = { 1: 16, 6: 16, 2: 25, 5: 25 };

/** The map cards picked now: [S.view], or the two parts of a combined map. */
function pickedMaps() {
  return (MAPS[S.view] && MAPS[S.view].parts) || [S.view];
}

/** A click on a business map card: alone → that map; with its pair already picked → both together in one map;
 *  a click on one of two picked cards → only the other one stays. */
function pickMap(i) {
  var cur = pickedMaps();
  if (cur.indexOf(i) >= 0) {
    if (cur.length === 2)
      setView(
        cur.filter(function (x) {
          return x !== i;
        })[0]
      );
    return;
  }
  if (cur.length === 1 && MAP_PAIR[i] === cur[0]) return setView(MAP_COMBO[i]);
  setView(i);
}

/** Accounts of map v for the current selection (the number on its card). */
function mapCount(v, extra) {
  var keep = S.view;
  S.view = v; // pass() depends on the map (pipelines only count on map 01)
  var n = S.acc.filter(function (a) {
    return MAPS[v].filter(a) && pass(a) && (!extra || extra(a));
  }).length;
  S.view = keep;
  return n;
}

/** A card in the look of a matrix box: the name, and the number of accounts below it. */
function navCard(on, onclick, name, n, title) {
  return (
    '<button class="mcard' +
    (on ? ' on' : '') +
    '" onclick="' +
    onclick +
    '"' +
    (title ? ' title="' + esc(title) + '"' : '') +
    '><span class="mt">' +
    esc(name) +
    '</span><span class="mn">' +
    n.toLocaleString('en-GB') +
    ' accounts</span></button>'
  );
}

function renderNav() {
  var cur = bizOf(S.view) || BIZ[0];
  document.getElementById('biz').innerHTML = BIZ.map(function (b) {
    return '<button class="' + (cur === b ? 'on' : '') + '" onclick="setBiz(\'' + b.k + '\')">' + esc(b.t) + '</button>';
  }).join('');
  var h = '';
  if (cur.k === 'business') {
    var picked = pickedMaps();
    h = cur.views
      .map(function (i, n) {
        // a small space between the two pairs (Current …, Past …)
        return (
          (n === 2 ? '<span class="mgap"></span>' : '') +
          navCard(
            picked.indexOf(i) >= 0,
            'pickMap(' + i + ')',
            MAPS[i].title,
            S.acc.length ? mapCount(i) : 0,
            'Click to show this map; click ' + MAPS[MAP_PAIR[i]].title + ' too to see both together'
          )
        );
      })
      .join('');
  }
  else {
    // No business: one card per classification (Past demand, Met in, Met out, Contacted, Not contacted), each with
    // its accounts counted whatever is picked
    var keep = S.nbCls;
    S.nbCls = [];
    h = MAPS[3].cols
      .map(function (c) {
        var n = S.acc.length
          ? mapCount(3, function (a) {
              return a.cls === c.k;
            })
          : 0;
        return navCard(!keep.length || keep.indexOf(c.k) >= 0, 'setNbCls(\'' + c.k + '\')', c.t, n, 'Click to show only / add / remove this classification');
      })
      .join('');
    S.nbCls = keep;
  }
  document.getElementById('tabs').innerHTML = h;
  renderSwitches();
}

/** BUSINESS → map 01 (or stays on 02 / 05); NO BUSINESS → map 03. */
function setBiz(k) {
  var b = BIZ.filter(function (x) {
    return x.k === k;
  })[0];
  if (b.views.indexOf(S.view) < 0) setView(b.views[0]);
}

/** No business: all classifications shown (S.nbCls empty) → a click shows only that one; then a click adds / removes
 *  one. Removing the last one, or picking all of them, shows all again. */
function setNbCls(k) {
  if (!S.nbCls.length) S.nbCls = [k];
  else {
    var i = S.nbCls.indexOf(k);
    if (i >= 0) S.nbCls.splice(i, 1);
    else S.nbCls.push(k);
  }
  if (S.nbCls.length === MAPS[3].cols.length) S.nbCls = [];
  if (S.view !== 3) S.view = 3;
  changed();
}

function setUnit(u) {
  if (u === null) S.units = [];
  else if (S.multiUnit) {
    var i = S.units.indexOf(u);
    if (i >= 0) S.units.splice(i, 1);
    else S.units.push(u);
  } else S.units = S.units.length === 1 && S.units[0] === u ? [] : [u];
  pruneOwners();
  changed();
}

function setGroup(gi) {
  var g = GROUPS[gi],
    on = g.units.every(function (x) {
      return S.units.indexOf(x) >= 0;
    });
  if (on)
    S.units = S.units.filter(function (x) {
      return g.units.indexOf(x) < 0;
    });
  else if (S.multiUnit)
    g.units.forEach(function (x) {
      if (S.units.indexOf(x) < 0) S.units.push(x);
    });
  else S.units = g.units.slice();
  pruneOwners();
  changed();
}

function toggleMulti(on) {
  S.multiUnit = on;
  var g = GROUPS[0].units,
    isGrp =
      S.units.length === g.length &&
      g.every(function (x) {
        return S.units.indexOf(x) >= 0;
      });
  if (!on && S.units.length > 1 && !isGrp) {
    S.units = [S.units[0]];
    pruneOwners();
    changed();
  } else renderUnits();
}

function setPipe(k) {
  if (k === null) S.pipes = [];
  else {
    var i = S.pipes.indexOf(k);
    if (i >= 0) S.pipes.splice(i, 1);
    else S.pipes.push(k);
  }
  changed();
}

/** Keep only the picked owners that still exist in the chosen service units. */
function pruneOwners() {
  S.owners = S.owners.filter(function (o) {
    return S.acc.some(function (a) {
      return (!S.units.length || S.units.indexOf(a.su) >= 0) && (a.owner || '(none)') === o;
    });
  });
  if (!S.units.length) S.owners = [];
}

function setView(i) {
  S.view = i;
  changed();
}

function changed() {
  S.hl = null;
  S.sel = [];
  tpReset(); // opened projects (Touchpoints) close again: back to the standard view
  S.g = newGrid();
  closePanel();
  closeDrawer();
  renderAll();
}

function renderAll() {
  renderRefresh();
  renderDb();
  renderUnits();
  renderOwners();
  renderFilters();
  render();
}

// clicking anywhere else closes the pipeline menu
document.addEventListener('mousedown', function (e) {
  if (S.pm && !e.target.closest('.pipes')) {
    S.pm = false;
    renderUnits();
  }
  if (S.xm && !e.target.closest('.rp')) {
    S.xm = false;
    renderSwitches();
  }
});
</script>
