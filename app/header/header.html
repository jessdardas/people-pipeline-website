<header class="top">
  <div class="logo">People Pipeline</div>
  <!-- People pipeline / New DB toggle, filled by renderDb() in header/header-js.html -->
  <div class="db" id="db"></div>
  <!-- "Last updated at …" + ↻ refresh button, filled by renderRefresh() in header/header-js.html -->
  <div class="rf" id="rf"></div>
  <!-- Search box, see search/ -->
  <div class="gs">
    <svg class="gs-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="gq" placeholder="Search an account…" autocomplete="off" oninput="gSearch()" onkeydown="gKey(event)" onfocus="gSearch()">
    <div class="gres" id="gres"></div>
  </div>
</header>

<!--
  Navigation in 4 levels (header/header-js.html):
    1. BUSINESS | NO BUSINESS · Class A (renderNav)  2. the maps of that choice (+ Recurrent) (renderNav)
    3. service units            (renderUnits)    4. users of the chosen unit(s) (renderOwners, shown with a click
                                                    on the "Service unit" label)
  + the small "Real projects only" switch on the right; the Filters button sits next to the pipeline menu (level 3).
-->
<nav class="nav lvl12">
  <div class="biz" id="biz"></div>
  <div class="maps" id="tabs"></div>
  <div class="navr">
    <div class="sws" id="sws"></div>
  </div>
</nav>

<!-- 3. service unit buttons, then - right next to them - the pipeline menu (map 01 only) and the Filters button -->
<div class="bar lvl3">
  <!-- a click on the label shows / hides the users row (level 4) -->
  <button class="lvlb" id="lvlb" onclick="toggleUsers()">Service unit</button>
  <div class="units" id="units"></div>
  <div class="barr">
    <div class="pipes" id="pipes"></div>
    <div class="fwrap">
      <div id="fbtn"></div>
      <div class="fpanel" id="fpanel"></div>
    </div>
  </div>
</div>

<!-- 4. users (owners) of the chosen service unit(s) - hidden until the "Service unit" label is clicked -->
<div class="owners lvl4" id="owners"></div>
