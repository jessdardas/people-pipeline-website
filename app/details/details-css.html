<style>
/* ==========================================================================
   DETAILS: the side panel that opens when you click an account
   Markup: details/details.html · filled by details/details-js.html (openDetail)
   ========================================================================== */

/* the grey layer behind the panel */
.dim {
  position: fixed;
  inset: 0;
  background: rgba(30, 27, 46, 0.28);
  backdrop-filter: blur(2px);
  display: none;
  z-index: 20;
}
.dim.open {
  display: block;
}

/* the panel, sliding in from the right */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(860px, 100vw); /* a bit wider: room for the project / activities tables */
  background: var(--surface);
  border-radius: 0;
  box-shadow: var(--shadow-lg);
  transform: translateX(105%);
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 30;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer.open {
  transform: none;
}

/* panel header: account name + unit · classification · category */
.dh {
  position: relative;
  padding: 24px 28px 18px;
  background: var(--soft);
}
.dh h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
  padding-right: 40px;
}
.dh .meta {
  color: var(--text-soft);
}
/* the × button */
.x {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow);
  font-size: 20px;
  line-height: 1;
  color: var(--text-soft);
  display: flex; /* centres the × */
  align-items: center;
  justify-content: center;
  padding: 0 0 2px;
}
.x:hover {
  color: var(--text);
}

/* panel body */
.det {
  overflow: auto;
  flex: 1;
  padding: 16px 28px 40px;
}

/* section titles: Overview, Projects (3), Social media (1) … */
.det h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  margin: 26px 0 10px;
}
.det h3::before {
  content: '';
  width: 4px;
  height: 14px;
  border-radius: 2px;
  background: var(--accent);
}

/* "Current pipeline › … — Show on map" */
.loc {
  background: var(--accent-soft);
  padding: 10px 14px;
  font-size: 12.5px;
  margin: 6px 0 4px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.loc button {
  color: var(--accent);
  font-weight: 700;
  font-size: 12.5px;
  white-space: nowrap;
}
.loc button:hover {
  text-decoration: underline;
}

/* label / value list (Overview, More details) */
.kv {
  display: grid;
  grid-template-columns: 170px 1fr;
  border: 1px solid var(--line);
  overflow: hidden;
}
.kv div {
  padding: 7px 12px;
  border-top: 1px solid var(--soft);
  font-size: 12.5px;
}
.kv div:nth-child(-n + 2) {
  border-top: 0;
}
.kv div:nth-child(odd) {
  color: var(--text-soft);
  background: #fafafa;
}

/* tables inside the panel (projects, social media) */
.det .tb th,
.det .tb tbody tr {
  cursor: default;
}
.det .tb th:hover {
  color: var(--text-soft);
}
/* column titles you can click to sort (detSort() in details/details-js) */
.det .tb th.ds {
  cursor: pointer;
}
.det .tb th.ds:hover,
.det .tb th.up,
.det .tb th.down {
  color: var(--text);
}
.det .tb th.up::after {
  content: ' ↑';
}
.det .tb th.down::after {
  content: ' ↓';
}
/* "+ columns" above the project table (rowsTable() in details/details-js) */
.dcols {
  position: relative;
  display: flex;
  justify-content: flex-end;
  margin: -4px 0 4px;
}
.dcols .lnk {
  font-size: 11px;
  color: var(--text-faint);
}
.dcols-m {
  display: none;
  position: absolute;
  right: 0;
  top: 100%;
  z-index: 5;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  padding: 6px 4px;
  min-width: 190px;
  max-height: 260px;
  overflow: auto;
}
.dcols-m.open {
  display: block;
}
.dcols-m label {
  display: flex;
  gap: 7px;
  align-items: center;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
}
/* contact persons: names only (contactNames() in details/details-js) */
.names {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.names li {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--soft);
  font-size: 12.5px;
}
/* activities (actsHtml() in details/details-js): filter + newest/oldest on top, then one tidy row each */
.acth {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.actf {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.actf button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-soft);
  background: var(--surface);
}
.actf button.on {
  border-color: var(--text);
  color: var(--text);
  font-weight: 600;
}
.actf button i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  border: 1.5px solid;
}
.actl {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.actl li {
  display: flex;
  gap: 14px;
  padding: 10px 14px;
  background: var(--surface);
}
.actl li + li {
  border-top: 1px solid var(--soft);
}
.actl li:hover {
  background: #fafbfd;
}
.actl .ad {
  width: 52px;
  flex: none;
  text-align: center;
  line-height: 1.15;
}
.actl .ad b {
  display: block;
  font-size: 13px;
}
.actl .ad small {
  font-size: 11px;
  color: var(--text-faint);
}
.actl .ab {
  flex: 1;
  min-width: 0;
}
.actl .at {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.actl .at b {
  font-size: 13px;
}
.actl .am {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-soft);
}
.actl .am em {
  font-style: normal;
  color: var(--text-faint);
}
.actl .ax {
  margin-top: 5px;
  font-size: 12px;
  color: var(--text-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  cursor: pointer;
}
.actl .ax.open {
  display: block;
}
/* collapse arrow in the table headers (addCollapse() in details/details-js) */
.det .clp {
  width: 20px;
  height: 20px;
  margin-right: 2px;
  border-radius: 5px;
  font-size: 11px;
  line-height: 1;
  color: var(--text-soft);
  transition: transform 0.15s;
}
.det .clp:hover {
  background: var(--line);
  color: var(--text);
}
.det th.cnt {
  white-space: nowrap;
}
.det table.collapsed tbody {
  display: none;
}
.det table.collapsed .clp,
.det #actBox.collapsed .clp {
  transform: rotate(-90deg);
}
.det #actBox.collapsed .actl,
.det #actBox.collapsed .actf button:not(.clp),
.det #actBox.collapsed .acth > .lnk {
  display: none;
}
.det .actf .clp {
  border: none;
  padding: 0;
  justify-content: center;
}
.det h3.collapsed + .kv {
  display: none;
}
.det h3.collapsed .clp {
  transform: rotate(-90deg);
}
.det h3 .clp {
  vertical-align: middle;
}
</style>
