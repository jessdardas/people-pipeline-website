<script>
/* Account details side panel */
/** noAgo: leave out the "(N days ago)" after dates (used by the Excel export). */
function fmtVal(h, v, a, noAgo) {
  if (v == null || v === '') return '—';
  var k = hKey(h);
  if (typeof v === 'number') {
    if (/date|creation/.test(k) && v > 20000) return noAgo ? fmtXl(v, true) : dateAgo(v, true);
    if (/days$/.test(k)) return Math.round(v).toLocaleString('en-GB') + ' days';
    if (/amount|value|revenue|price|budget/.test(k)) return fmtMoney(v, a && a.cur);
    return (Math.round(v * 100) / 100).toLocaleString('en-GB');
  }
  return String(v);
}

function cellHtml(h, v, a) {
  var s = fmtVal(h, v, a);
  if (/serviceunit/.test(hKey(h)) && typeof v === 'string') return esc(unitLabel(suKey(v)));
  if (typeof v === 'string' && /^https?:\/\//i.test(v))
    return (
      '<a href="' +
      esc(v) +
      '" target="_blank" rel="noopener">' +
      esc(v.replace(/^https?:\/\/(www\.)?/, '').replace(/\?.*$/, '')) +
      '</a>'
    );
  return esc(s);
}

var DET_HIDE = {};
[
  'name',
  'classification',
  'classificationorder',
  'category',
  'categoryorder',
  'originalcategory',
  'industry',
  'country',
  'city',
  'serviceunit',
  'owneridname',
  'metin',
  'lastmeetingdate',
  'lastmeetingindate',
  'lastmeetingoutdate',
  'lastmeetingdays',
  'lastcontact1date',
  'lastprojectdatein',
  'lastprojectdays',
  'phasegroup',
  'pipeline',
  'prep1count',
  'postp1count',
  'postp1amount',
  'currencysymbol',
  'accountcreation',
  'accountcreateddays',
  'classification2',
  'username'
].forEach(function (k) {
  DET_HIDE[k] = 1;
});

var NAME_KEYS = ['projectname', 'opportunityname', 'name', 'topic', 'title', 'project'];

function nameCol(s) {
  if (s._nc === undefined) {
    s._nc = -1;
    for (var i = 0; i < s.hk.length; i++)
      if (
        NAME_KEYS.indexOf(s.hk[i]) >= 0 ||
        (/name/.test(s.hk[i]) && !/serviceunit|owner|user/.test(s.hk[i]))
      ) {
        s._nc = i;
        break;
      }
  }
  return s._nc;
}

// project table in the details: always name + these columns (phase, status); others via "+ columns"
var DET_PROJ_BASE = /^(phasegroup|phase|statecodename|status)$/;
var DET_PROJ_KEY = 'pp_detail_project_columns';

function detProjCols() {
  try {
    return JSON.parse(localStorage.getItem(DET_PROJ_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

/** Add / remove a column of the project table in the details (k = column name, letters only). */
function detProjCol(k) {
  var l = detProjCols(),
    i = l.indexOf(k);
  if (i >= 0) l.splice(i, 1);
  else l.push(k);
  try {
    localStorage.setItem(DET_PROJ_KEY, JSON.stringify(l));
  } catch (e) {}
  var b = document.getElementById('aBody'),
    top = b.scrollTop;
  if (S.detail && S.byId[S.detail]) openDetail(S.byId[S.detail].i);
  b.scrollTop = top;
  var m = b.querySelector('.dcols-m');
  if (m) m.classList.add('open');
}

function projName(e) {
  var s = S.sheets[e.s],
    c = nameCol(s);
  return c < 0 ? '' : cv(e.s, c, e.j) || '';
}

function rowsTable(entries, a) {
  if (!entries.length) return '<p class="meta">None.</p>';
  var si = entries[0].s,
    s = S.sheets[si];
  // no ids, no columns that are empty for every row; a project/opportunity name column goes first
  var cols = s.cols
    .map(function (c, i) {
      return i;
    })
    .filter(function (i) {
      return (
        !/id$/.test(s.hk[i]) &&
        !(s.role === 'projects' && /^(accountname|serviceunitname)$/.test(s.hk[i])) && // already shown above
        ((s.role === 'projects' && i === nameCol(s)) ||
          entries.some(function (e) {
            return cv(e.s, i, e.j) != null;
          }))
      );
    });
  var nc = s.role === 'projects' ? nameCol(s) : -1;
  cols.sort(function (x, y) {
    return (x === nc ? -1 : 0) - (y === nc ? -1 : 0);
  });
  var pick = '';
  if (s.role === 'projects') {
    // projects: name, phase and status; the small "+ columns" button adds others (remembered in this browser)
    var all = cols.slice(),
      extra = detProjCols();
    cols = all.filter(function (i) {
      return i === nc || DET_PROJ_BASE.test(s.hk[i]) || extra.indexOf(s.hk[i]) >= 0;
    });
    pick =
      '<div class="dcols"><button class="lnk" onclick="this.nextSibling.classList.toggle(\'open\')">+ columns</button><div class="dcols-m">' +
      all
        .filter(function (i) {
          return i !== nc && !DET_PROJ_BASE.test(s.hk[i]);
        })
        .map(function (i) {
          return (
            '<label><input type="checkbox" ' +
            (extra.indexOf(s.hk[i]) >= 0 ? 'checked' : '') +
            ' onchange="detProjCol(\'' +
            esc(s.hk[i]) +
            '\')">' +
            esc(pretty(s.cols[i].h)) +
            '</label>'
          );
        })
        .join('') +
      '</div></div>';
  }
  var h =
    pick +
    '<div class="tw"><table class="tb"><thead><tr><th class="cnt">#</th>' +
    cols
      .map(function (i) {
        return (
          '<th class="ds" onclick="detSort(this)" title="Click to sort, click again to reverse">' +
          esc(i === nc ? 'Project name' : pretty(s.cols[i].h)) +
          '</th>'
        );
      })
      .join('') +
    '</tr></thead><tbody>';
  entries.forEach(function (e, n) {
    h +=
      '<tr><td class="cnt">' +
      (n + 1) +
      '</td>' +
      cols
        .map(function (i) {
          var v = cv(e.s, i, e.j);
          return '<td data-v="' + esc(v == null ? '' : typeof v === 'number' ? v : String(v).toLowerCase()) + '">' + cellHtml(s.cols[i].h, v, a) + '</td>';
        })
        .join('') +
      '</tr>';
  });
  return h + '</tbody></table></div>';
}

/** Click a column title in a details table: sort A→Z / low→high, click again: Z→A / high→low (empty cells last). */
function detSort(th) {
  var t = th.closest('table'),
    ci = th.cellIndex,
    d = th.getAttribute('data-d') === '1' ? -1 : 1;
  [].forEach.call(t.tHead.rows[0].cells, function (c) {
    c.removeAttribute('data-d');
    c.classList.remove('up', 'down');
  });
  th.setAttribute('data-d', d);
  th.classList.add(d === 1 ? 'up' : 'down');
  var body = t.tBodies[0],
    rows = [].slice.call(body.rows);
  rows.sort(function (x, y) {
    var a = x.cells[ci].getAttribute('data-v'),
      b = y.cells[ci].getAttribute('data-v');
    if (a === '' || b === '') return (a === '') - (b === '');
    var na = Number(a),
      nb = Number(b);
    return d * (!isNaN(na) && !isNaN(nb) ? na - nb : a.localeCompare(b, undefined, { numeric: true }));
  });
  rows.forEach(function (r, n) {
    r.cells[0].textContent = n + 1;
    body.appendChild(r);
  });
}

/** The account's contact person names (each once, A→Z). */
function contactNames(a) {
  var seen = {};
  a.contacts.forEach(function (e) {
    var c = contactNameCol(S.sheets[e.s]),
      v = c < 0 ? '' : String(cv(e.s, c, e.j) || '').trim();
    if (v) seen[v] = 1;
  });
  return Object.keys(seen).sort(function (x, y) {
    return x.localeCompare(y);
  });
}

/** A web address as a link that opens in a new tab (adds https:// when it is missing). */
function webLink(u) {
  var href = /^https?:\/\//i.test(u) ? u : 'https://' + u;
  return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(String(u).replace(/^(https?:\/\/)?(www\.)?/i, '').replace(/\/$/, '')) + '</a>';
}

/* ---------- activities in the account details: a tidy list, newest first ----------
   Each activity = one row: the date (left), the type (colour, ACT_COLORS) + the subject, a small line with the
   other filled-in columns (owner, regarding, status …), and long texts (e.g. description) below, 2 lines
   (click to see all). On top: filter by type, newest / oldest first. Tasks are never shown (ACT_HIDE). */
var ACT_VIEW = { type: '', asc: false }; // the choice above the list (kept while the page is open)

/** The activities block of the details panel (its contents are drawn by renderActs()). */
function actsBlock(a) {
  return '<div id="actBox" data-i="' + a.i + '">' + actsHtml(a) + '</div>';
}

function renderActs() {
  var box = document.getElementById('actBox');
  if (box) box.innerHTML = actsHtml(S.acc[+box.getAttribute('data-i')]);
}

function setActType(t) {
  ACT_VIEW.type = ACT_VIEW.type === t ? '' : t;
  renderActs();
}

function actsHtml(a) {
  var s = S.sheets[acts(a)[0].e.s],
    own = [actCol(s, 'date'), actCol(s, 'type'), actCol(s, 'subject')],
    // the other columns that are filled in for at least one activity (no ids)
    more = s.cols
      .map(function (c, i) {
        return i;
      })
      .filter(function (i) {
        return (
          own.indexOf(i) < 0 &&
          !/id$/.test(s.hk[i]) &&
          acts(a).some(function (x) {
            return cv(x.e.s, i, x.e.j) != null;
          })
        );
      });
  // types with their counts → filter buttons
  var cnt = {};
  acts(a).forEach(function (x) {
    var t = x.type || 'Other';
    cnt[t] = (cnt[t] || 0) + 1;
  });
  var list = acts(a)
    .filter(function (x) {
      return !ACT_VIEW.type || (x.type || 'Other') === ACT_VIEW.type;
    })
    .slice()
    .sort(function (x, y) {
      return ((x.date || 0) - (y.date || 0)) * (ACT_VIEW.asc ? 1 : -1);
    });
  var h =
    '<div class="acth"><div class="actf"><button class="clp" onclick="toggleActs(this)" title="Hide / show the activities">▾</button><button class="' +
    (ACT_VIEW.type ? '' : 'on') +
    '" onclick="ACT_VIEW.type=\'\';renderActs()">All ' +
    acts(a).length +
    '</button>' +
    Object.keys(cnt)
      .sort()
      .map(function (t) {
        var c = actColor(t);
        return (
          '<button class="' +
          (ACT_VIEW.type === t ? 'on' : '') +
          '" onclick="setActType(\'' +
          esc(t).replace(/'/g, '&#39;') +
          '\')"><i style="background:' +
          c.bg +
          ';border-color:' +
          c.fg +
          '"></i>' +
          esc(t) +
          ' ' +
          cnt[t] +
          '</button>'
        );
      })
      .join('') +
    '</div><button class="lnk" onclick="ACT_VIEW.asc=!ACT_VIEW.asc;renderActs()">' +
    (ACT_VIEW.asc ? 'Oldest first ↑' : 'Newest first ↓') +
    '</button></div><ol class="actl">';
  list.forEach(function (x) {
    var d = x.date != null ? new Date((x.date - 25569) * 864e5) : null,
      meta = [],
      long = [];
    // emails (ACT_BRIEF): only date, type and subject
    (ACT_BRIEF.test(x.type) ? [] : more).forEach(function (i) {
      var v = cv(x.e.s, i, x.e.j);
      if (v == null || v === '') return;
      var txt = fmtVal(s.cols[i].h, v, a, true);
      if (String(txt).length > 60) long.push(txt);
      else meta.push('<span><em>' + esc(pretty(s.cols[i].h)) + '</em> ' + esc(txt) + '</span>');
    });
    h +=
      '<li><div class="ad">' +
      (d
        ? '<b>' + d.getUTCDate() + ' ' + d.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' }) + '</b><small>' + d.getUTCFullYear() + '</small>'
        : '<b>—</b>') +
      '</div><div class="ab"><div class="at">' +
      (x.type ? actChip(x) : '') +
      '<b>' +
      esc(x.subject || '(no subject)') +
      '</b></div>' +
      (meta.length ? '<div class="am">' + meta.join('') + '</div>' : '') +
      long
        .map(function (t) {
          return '<div class="ax" onclick="this.classList.toggle(\'open\')" title="Click to see all">' + esc(t) + '</div>';
        })
        .join('') +
      '</div></li>';
  });
  return h + '</ol>';
}

/* ---------- collapsible tables in the details: a small arrow in each table header ----------
   Open by default. The arrow hides the rows (the header row stays, so it can be opened again). */
function addCollapse(root) {
  root.querySelectorAll('table.tb').forEach(function (t) {
    var th = t.tHead && t.tHead.rows[0] && t.tHead.rows[0].cells[0];
    if (!th || th.querySelector('.clp')) return;
    th.insertAdjacentHTML('afterbegin', '<button class="clp" onclick="toggleTbl(this,event)" title="Hide / show the rows">▾</button>');
  });
  // every other section (Overview, contact persons, touchpoints, More details …): the arrow sits in its title and
  // hides what follows the title (sections with a table use the arrow in the table header instead)
  root.querySelectorAll('h3').forEach(function (h3) {
    var next = h3.nextElementSibling;
    if (h3.querySelector('.clp') || !next || next.querySelector('table.tb') || next.id === 'actBox') return;
    h3.insertAdjacentHTML('afterbegin', '<button class="clp" onclick="this.closest(\'h3\').classList.toggle(\'collapsed\')" title="Hide / show">▾</button>');
  });
}

function toggleTbl(btn, e) {
  e.stopPropagation(); // not a sort click
  var t = btn.closest('table');
  t.classList.toggle('collapsed');
}

function toggleActs(btn) {
  document.getElementById('actBox').classList.toggle('collapsed');
}

function locate(a) {
  var v = viewOf(a);
  var def = MAPS[v],
    p = placesOf(def, a)[0],
    key = String(p[0]) + '§' + String(p[1]);
  var rw = def.rows.filter(function (x) {
      return String(x.k) === String(p[0]);
    })[0],
    cl = def.cols.filter(function (x) {
      return String(x.k) === String(p[1]);
    })[0];
  return {
    v: v,
    key: key,
    txt: def.title + ' › ' + def.y + ' ' + (rw ? rw.t : p[0]) + ' × ' + def.x + ' ' + (cl ? cl.t : p[1])
  };
}

function openDetail(i) {
  var a = S.acc[i];
  if (!a) return;
  S.detail = a.id;
  document.getElementById('aTitle').textContent = a.name;
  document.getElementById('aMeta').textContent = [unitLabel(a.su), cap(a.cls), cap(a.category)]
    .filter(Boolean)
    .join(' · ');
  var loc = locate(a);
  var kv = [
    ['Classification', cap(a.cls)],
    ['Category', cap(a.category)],
    ['Industry', cap(a.industry)],
    ['Country', cap(a.country)],
    ['City', a.city],
    ['Service unit', unitLabel(a.su)],
    ['Owner', cap(a.owner)],
    ['Met in', cap(a.metIn)],
    ['Last meeting', a.lmDate ? dateAgo(a.lmDate, false, a.lastMeeting) : 'never'],
    ['Last contact', a.lcDate ? dateAgo(a.lcDate, false, a.lastContact) : 'never'],
    ['Last project', a.lpDate ? dateAgo(a.lpDate, false, a.lastProject) + (a.lpFromProj ? ' (from its projects)' : '') : 'never'],
    ['Pipeline', a.pipe ? PIPES[a.pipe - 1].t + ' — ' + PIPES[a.pipe - 1].s : '—'],
    ['Pre-P1 projects', a.preN],
    ['Post-P1 projects', a.postN],
    ['Post-P1 value', a.postV ? fmtMoney(a.postV, a.cur) : '—'],
    ['Projects in list', a.projects.length + (a.projPhases.length ? ' · ' + a.projPhases.join(', ') : '')],
    ['Social media', a.social.length ? socialSummary(a) : 'no'],
    ['Last validated on', a.validDate ? dateAgo(a.validDate, false, a.validDays) : '—'],
    ['Account created', dateAgo(num(F(a, 'account_creation'))) || '—'],
    // the account's website (S.webKey, see build() in core/data-js) as a link; x[2] = ready-made HTML
    ['Website', a.website || '—', a.website ? webLink(a.website) : '']
  ];
  var h =
    '<div class="loc"><span>' +
    esc(loc.txt) +
    '</span><button onclick="goTo(' +
    a.i +
    ')">Show on map</button></div>';
  h +=
    '<h3>Overview</h3><div class="kv">' +
    kv
      .map(function (x) {
        return (
          '<div>' + esc(x[0]) + '</div><div>' + (x[2] || esc(x[1] === '' || x[1] == null ? '—' : x[1])) + '</div>'
        );
      })
      .join('') +
    '</div>';
  // contact persons (Query 5 in the Excel file): only their names - only shown here, not in the big table
  var names = contactNames(a);
  h +=
    '<h3>Contact persons (' +
    names.length +
    ')</h3>' +
    (names.length
      ? '<ul class="names">' +
        names
          .map(function (n) {
            return '<li>' + esc(n) + '</li>';
          })
          .join('') +
        '</ul>'
      : '<p class="meta">None yet.</p>');
  // the account's real projects: the same table as the Touchpoints view (# | Project | Phase | Accounts); click a project
  // to tick its touchpoints per account (touch/touchpoints-js)
  h += '<h3>Projects (' + accProjects(a).length + ')</h3>' + tpAccountHtml(a);
  h += '<h3>Social media (' + a.social.length + ')</h3>' + groupTables(a.social, a);
  // publications (read-only: Pub 1, Pub 2 … from the contact persons) + the account's activities (no tasks)
  h +=
    '<h3>Publications</h3><div class="kv">' +
    (pubNums().length ? '' : '<div>Publications</div><div>none in the file yet</div>') +
    pubNums()
      .map(function (n) {
        var l = a.tp.pub[n] || [];
        return '<div>Pub ' + n + '</div><div>' + tpBox(l.length > 0) + ' ' + esc(pubText(l)) + '</div>';
      })
      .join('') +
    '</div>';
  if (acts(a).length) h += '<h3>Activities (' + acts(a).length + ')</h3>' + actsBlock(a);
  if (a.lists.length) h += '<h3>Other linked rows (' + a.lists.length + ')</h3>' + groupTables(a.lists, a);
  // any other column in the file (new query columns show up here automatically)
  var more = [];
  S.sheets.forEach(function (s) {
    if (s.role !== 'accounts' && s.role !== 'merge') return;
    var j = s.role === 'accounts' ? a.i : a.mr[s.si];
    s.cols.forEach(function (c, ci) {
      if (DET_HIDE[s.hk[ci]] || s.hk[ci] === S.cityKey || s.hk[ci] === S.webKey || /id$/.test(s.hk[ci]) || /validat/.test(s.hk[ci])) return;
      more.push(
        '<div>' +
          esc(pretty(c.h)) +
          '</div><div>' +
          (j == null ? '—' : cellHtml(c.h, cv(s.si, ci, j), a)) +
          '</div>'
      );
    });
  });
  if (more.length) h += '<h3>More details</h3><div class="kv">' + more.join('') + '</div>';
  document.getElementById('aBody').innerHTML = h;
  addCollapse(document.getElementById('aBody'));
  document.getElementById('aBody').scrollTop = 0;
  openDrawer();
}

function groupTables(entries, a) {
  if (!entries.length) return '<p class="meta">None.</p>';
  var by = {};
  entries.forEach(function (e) {
    (by[e.s] = by[e.s] || []).push(e);
  });
  return Object.keys(by)
    .map(function (si) {
      return rowsTable(by[si], a);
    })
    .join('');
}

/* open / close the panel (the grey layer behind it is #dim) */
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('dim').classList.add('open');
}

function closeDrawer() {
  S.detail = null;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('dim').classList.remove('open');
}
</script>
