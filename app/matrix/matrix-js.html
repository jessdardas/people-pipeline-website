<script>
/* Draws the matrix for the current view */
/** The two small switches in the navigation row (#sws), kept quiet on purpose:
 *  - "Without P0" (ON by default, map 01 Current pipeline only): P0 projects are left out (P0_PHASE in core/config-js)
 *  - "Real projects only" (ON by default, the whole dashboard) + ▾ menu: which kinds of projects are left out
 *    (PROJECT_EXCLUDE); accounts linked to internal users are removed everywhere (see hiddenAcc() in core/data-js) */
function renderSwitches() {
  var el = document.getElementById('sws');
  if (el) el.innerHTML = cleanHtml();
}

function cleanHtml() {
  // in the ▾ menu, next to each kind: how many ACCOUNTS it concerns - always the same, ticked or not
  // (counted with "Real projects only" off, in the current service unit / user / New DB / Filters selection):
  //   Internal owner = the accounts that are removed completely (an internal-owner project, or an internal owner)
  //   the other kinds = the accounts that have at least one such project (those projects are taken out)
  var n = {},
    keep = S.clean;
  S.clean = false;
  S.acc.forEach(function (a) {
    if (!pass(a)) return;
    PROJECT_EXCLUDE.forEach(function (e) {
      var hit =
        e.k === 'own'
          ? a.intOwner || a.intKinds.own
          : a.pj.some(function (o) {
              return o[e.k];
            });
      if (hit) n[e.k] = (n[e.k] || 0) + 1;
    });
  });
  S.clean = keep;
  var h =
    '<span class="rps">' +
    (S.view === 1
      ? '<span class="rp"><label class="sw" title="Leave out P0 projects (Current pipeline)"><input type="checkbox" ' +
        (S.noP0 ? 'checked' : '') +
        ' onchange="setNoP0(this.checked)"><i></i>Without P0</label></span>'
      : '') +
    '<span class="rp"><label class="sw" title="Leave out ' +
    esc(
      PROJECT_EXCLUDE.filter(function (e) {
        return S.px[e.k];
      })
        .map(function (e) {
          return e.t;
        })
        .join(', ') || 'nothing'
    ) +
    ' projects"><input type="checkbox" ' +
    (S.clean ? 'checked' : '') +
    ' onchange="setClean(this.checked)"><i></i>Real projects only</label><button class="rp-b" onclick="S.xm=!S.xm;renderSwitches()" title="Choose what is left out">▾</button>';
  if (S.xm)
    h +=
      '<div class="rp-m"><div class="rp-h">Leave out these projects<br><small>number = accounts concerned (whole accounts removed for Internal owner) · unticked = shown, in "other" on map 01</small></div>' +
      PROJECT_EXCLUDE.map(function (e, i) {
        return (
          '<label><input type="checkbox" ' +
          (S.px[e.k] ? 'checked' : '') +
          (S.clean ? '' : ' disabled') +
          ' onchange="setKind(' +
          i +
          ')">' +
          esc(e.t) +
          '<small title="' +
          (e.k === 'own' ? 'accounts removed completely' : 'accounts with such projects') +
          '">' +
          (n[e.k] || 0).toLocaleString('en-GB') +
          ' acc.</small></label>'
        );
      }).join('') +
      '<div class="rp-f"><button class="lnk" onclick="S.px=defaultPx();changed();S.xm=true;renderSwitches()">standard</button></div></div>';
  return h + '</span></span>';
}

function setNoP0(on) {
  S.noP0 = on;
  changed();
}

function setClean(on) {
  S.clean = on;
  changed();
}

/** Tick / untick one kind of project in the ▾ menu (the menu stays open). */
function setKind(i) {
  var k = PROJECT_EXCLUDE[i].k;
  if (S.px[k]) delete S.px[k];
  else S.px[k] = 1;
  changed();
  S.xm = true;
  renderSwitches();
}

function scopeText() {
  var u = S.units.length ? S.units.map(unitLabel).join(', ') : 'All service units';
  var p = S.pipes.length
    ? S.pipes
        .slice()
        .sort()
        .map(function (k) {
          return 'Pipeline ' + k;
        })
        .join(', ')
    : 'All pipelines';
  var parts = [S.db === 'newdb' ? 'New DB (validated on or after ' + fmtXl(newDbSerial()) + ')' : '', u];
  if (S.owners.length)
    parts.push(
      'Owner: ' +
        S.owners
          .map(function (o) {
            return o === '(none)' ? 'no owner' : cap(o);
          })
          .join(', ')
    );
  if (S.view === 1) parts.push(p); // pipelines only apply to map 01
  if (S.view === 1 || S.view === 2 || S.view === 5) {
    // the two switches: only mentioned when they differ from the standard view
    if (!S.noP0 && S.view === 1) parts.push('incl. P0');
    var std = defaultPx(),
      diff = PROJECT_EXCLUDE.filter(function (e) {
        return !S.clean ? std[e.k] : !!S.px[e.k] !== !!std[e.k];
      });
    if (diff.length)
      parts.push(
        diff
          .map(function (e) {
            return (S.clean && S.px[e.k] ? 'without ' : 'incl. ') + e.t;
          })
          .join(', ')
      );
  }
  return parts.filter(Boolean).join(' · ');
}

function filterText() {
  var parts = [];
  activeF().forEach(function (f) {
    parts.push(
      f.t +
        ': ' +
        S.F[f.k]
          .map(function (v) {
            return f.lab ? f.lab(v) : cap(v);
          })
          .join(', ')
    );
  });
  if (S.social !== 'all') parts.push('Social media: ' + (S.social === 'yes' ? 'yes' : 'no'));
  activeSF().forEach(function (f) {
    parts.push(f.t + ': ' + S.SF[f.k].join(', '));
  });
  return parts.join(' · ');
}

/** Colour of a matrix cell: from --heat-low (few) to --heat-high (the most), set in core/base-css.html */
function heatColor(t) {
  if (!heatColor.lo) {
    var css = getComputedStyle(document.documentElement);
    var hex = function (name, dflt) {
      var v = (css.getPropertyValue(name) || dflt).trim().replace('#', '');
      return [0, 2, 4].map(function (i) {
        return parseInt(v.substr(i, 2), 16);
      });
    };
    heatColor.lo = hex('--heat-low', '#eaf2fb');
    heatColor.hi = hex('--heat-high', '#7ea7da');
  }
  var c = heatColor.lo.map(function (lo, i) {
    return Math.round(lo + (heatColor.hi[i] - lo) * Math.sqrt(t)); // sqrt: small numbers still get some colour
  });
  return 'rgb(' + c.join(',') + ')';
}

function render() {
  var main = document.getElementById('main');
  if (!S.acc.length) return;
  var def = MAPS[S.view];
  var data = S.acc.filter(function (a) {
    return def.filter(a) && pass(a);
  });
  var ft = filterText();
  var h =
    '<div class="head"><div><h1>' +
    esc(def.title) +
    ' <span class="cnt-title">(' +
    data.length.toLocaleString('en-GB') +
    (data.length === 1 ? ' account' : ' accounts') +
    ')</span></h1><div class="meta">' +
    esc(scopeText()) +
    (ft ? ' · ' + esc(ft) : '') +
    '</div></div>' +
    '<div class="hright">' +
    '<label class="multi" title="Tick, then click several boxes (or row / column titles) to list their accounts together"><input type="checkbox" ' +
    (S.multiCell ? 'checked' : '') +
    ' onchange="S.multiCell=this.checked">select several boxes</label></div>' +
    '</div>';
  if (!data.length) {
    main.innerHTML =
      h +
      '<div class="empty"><div class="empty-icon">🔍</div><p>No accounts for this selection.</p><p class="hint">Try another service unit, pipeline or filter.</p></div>';
    return;
  }

  var cells = {},
    rowT = {},
    colT = {};
  // totals count UNIQUE accounts: an account in 2 boxes of a row counts once in that row's total
  var rowSeen = {},
    colSeen = {};
  data.forEach(function (a) {
    placesOf(def, a).forEach(function (p) {
      var k = p[0] + '§' + p[1];
      if ((cells[k] = cells[k] || []).indexOf(a) < 0) cells[k].push(a);
      var rk = p[0] + '|' + a.i,
        ck = p[1] + '|' + a.i;
      if (!rowSeen[rk]) {
        rowSeen[rk] = 1;
        rowT[p[0]] = (rowT[p[0]] || 0) + 1;
      }
      if (!colSeen[ck]) {
        colSeen[ck] = 1;
        colT[p[1]] = (colT[p[1]] || 0) + 1;
      }
    });
  });
  var total = data.length;
  var rows = def.rows.filter(function (x) {
    return !x.opt || rowT[x.k];
  });
  var cols = def.cols
    .filter(function (x) {
      if (def.hideCol && def.hideCol(x)) return false; // e.g. map 01 without the P0 column
      return !x.opt || colT[x.k];
    })
    .map(function (x) {
      // No business: a classification that is not picked stays as an empty gap (the map keeps its size)
      return def.colPick && !def.colPick(x) ? Object.assign({}, x, { gap: 1 }) : x;
    });
  var max = 0;
  Object.keys(cells).forEach(function (k) {
    max = Math.max(max, cells[k].length);
  });

  h +=
    '<div class="matrix"><table class="grid"><thead><tr><th class="yl"></th><th class="xl"></th><th class="xl" colspan="' +
    cols.length +
    '">' +
    esc(def.x) +
    ' →</th><th class="xl"></th></tr>';
  h +=
    '<tr><th class="yl"></th><th class="xl" style="vertical-align:bottom;text-align:left">' +
    esc(def.y) +
    ' ↓</th>' +
    cols
      .map(function (c) {
        // every data column gets the same width; the label and Total columns only take what they need
        if (c.gap) return '<th class="col gap" style="width:' + (94 / cols.length).toFixed(2) + '%"></th>';
        return (
          '<th class="col" style="width:' +
          (94 / cols.length).toFixed(2) +
          '%" onclick="selectLine(\'c\',\'' +
          esc(String(c.k)) +
          '\')" title="Select the whole column">' +
          esc(c.t) +
          '</th>'
        );
      })
      .join('') +
    '<th class="tot">Total</th></tr></thead><tbody>';
  rows.forEach(function (rw, i) {
    h +=
      '<tr>' +
      (i === 0 ? '<th class="yl" rowspan="' + rows.length + '"><div>' + esc(def.y) + '</div></th>' : '') +
      '<th class="row" onclick="selectLine(\'r\',\'' +
      esc(String(rw.k)) +
      '\')" title="Select the whole row">' +
      esc(rw.t) +
      (rw.s ? '<small>' + esc(rw.s) + '</small>' : '') +
      '</th>';
    cols.forEach(function (c) {
      if (c.gap) return (h += '<td class="c gap"></td>');
      var list = cells[rw.k + '§' + c.k] || [],
        n = list.length,
        key = String(rw.k) + '§' + String(c.k);
      var hl = S.hl && S.hl.v === S.view && S.hl.key === key;
      if (!n) {
        h += '<td class="c zero' + (hl ? ' hl' : '') + '" data-key="' + esc(key) + '">–</td>';
        return;
      }
      var sel = S.sel.indexOf(key) >= 0;
      h +=
        '<td class="c' +
        (sel ? ' sel' : '') +
        (hl ? ' hl' : '') +
        '" data-key="' +
        esc(key) +
        '" style="background:' +
        heatColor(max ? n / max : 0) +
        '"><button onclick="openCell(\'' +
        esc(String(rw.k)) +
        "','" +
        esc(String(c.k)) +
        '\')" title="' +
        esc(
          n.toLocaleString('en-GB') +
            (n === 1 ? ' account' : ' accounts') +
            ' · ' +
            rw.t +
            ' × ' +
            c.t +
            ' (click to see them)'
        ) +
        '">' +
        n.toLocaleString('en-GB') +
        '</button></td>';
    });
    // totals are clickable: the row total lists the accounts of the whole row
    h +=
      '<td class="tot ck" onclick="selectLine(\'r\',\'' +
      esc(String(rw.k)) +
      '\')" title="See these accounts">' +
      (rowT[rw.k] || 0).toLocaleString('en-GB') +
      '</td></tr>';
  });
  h +=
    '<tr class="sum"><th class="yl"></th><th>Total</th>' +
    cols
      .map(function (c) {
        if (c.gap) return '<td class="tot gap"></td>';
        return (
          '<td class="tot ck" onclick="selectLine(\'c\',\'' +
          esc(String(c.k)) +
          '\')" title="See these accounts">' +
          (colT[c.k] || 0).toLocaleString('en-GB') +
          '</td>'
        );
      })
      .join('') +
    '<td class="tot grand ck" onclick="selectAllCells()" title="See all these accounts"><b>' +
    total.toLocaleString('en-GB') +
    '</b> acc.</td></tr>';
  h += '</tbody></table></div>';
  S._cells = cells;
  S.sel = S.sel.filter(function (k) {
    return cells[k]; // boxes that no longer exist (other filter) are dropped
  });
  if (S.sel.length) {
    var label = function (key) {
      var pk = key.split('§'),
        rw0 = rows.filter(function (x) {
          return String(x.k) === pk[0];
        })[0],
        cl0 = cols.filter(function (x) {
          return String(x.k) === pk[1];
        })[0];
      return (rw0 ? rw0.t : pk[0]) + ' × ' + (cl0 ? cl0.t : pk[1]);
    };
    var all = [];
    S.sel.forEach(function (k) {
      all = all.concat(cells[k]);
    });
    S.list = all.filter(function (a, i) {
      return all.indexOf(a) === i; // an account in 2 selected boxes (or with 2 projects) is listed once
    });
    S.listMeta =
      S.sel.length === 1
        ? def.title + ' › ' + def.y + ': ' + label(S.sel[0]).replace(' × ', ' × ' + def.x + ': ')
        : def.title + ' › ' + S.sel.length + ' boxes: ' + S.sel.map(label).join(' · ');
    h += listBlock(S.listMeta, true);
  } else if (S.view === 4) {
    S.list = data.slice();
    S.listMeta = 'All accounts';
    h += listBlock('All accounts in this selection · click a number above to narrow the list', false);
  } else h += '<p class="hint">Click a number to see its accounts below.</p>';
  main.innerHTML = h;
  if (S.list && (S.sel.length || S.view === 4)) renderList();
}
</script>
