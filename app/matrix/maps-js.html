<script>
/* The four matrix views (rows, columns, and where each account lands) */
function catKey(c) {
  c = String(c || '')
    .toLowerCase()
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ');
  if (c === 'design practice') return 'design practice';
  if (/end user - individual/.test(c)) return 'end user - individual';
  if (/end user - developer/.test(c)) return 'end user - developer';
  if (/end user - brand/.test(c)) return 'end user - brand';
  if (c === 'cce') return 'cce';
  return 'other';
}

function mo(d) {
  return d == null ? null : d / M;
}

function band(v, edges, nullKey) {
  if (v == null) return nullKey;
  for (var i = 0; i < edges.length; i++) if (v < edges[i]) return i;
  return edges.length;
}

// account category rows (maps 01, 03 and All accounts)
var CATEGORY_ROWS = [
  { k: 'design practice', t: 'Design Practice' },
  { k: 'end user - individual', t: 'End User – Individual' },
  { k: 'end user - developer', t: 'End User – Developer' },
  { k: 'end user - brand', t: 'End User – Brand' },
  { k: 'cce', t: 'CCE' },
  { k: 'other', t: 'Other', s: 'incl. lighting designer / dealer' }
];

// last meeting rows (maps 02 Past clients and 05 Past business)
var MEETING_ROWS = [
  { k: 0, t: '0–3 months' },
  { k: 1, t: '3–6 months' },
  { k: 2, t: '6–9 months' },
  { k: 3, t: '9–12 months' },
  { k: 4, t: '12–15 months' },
  { k: 5, t: '15–18 months' },
  { k: 6, t: '18+ months' },
  { k: 'n', t: 'No meeting', s: 'never met', opt: 1 }
];

/** The last-project column of a past client: 0 = 0–6, 1 = 6–12, 2 = 12–18, 3 = 18+ months, 'n' = no project.
 *  The file's project bucket (classification2 = 1…4) wins when it is filled in. */
function pastCol(a) {
  return /^[1-4]$/.test(a.pb) ? +a.pb - 1 : band(mo(lastProjectDays(a)), [6, 12, 18], 'n');
}

var MAPS = {
  1: {
    title: 'Current client',
    // the accounts classified current client; one whose open projects are ALL left out ("Real projects only") leaves
    filter: function (a) {
      return a.cls === 'current client' && (!a.open.length || keptOpen(a).length > 0);
    },
    x: 'Phase of open projects',
    y: 'Account category',
    cols: PHASES.map(function (p) {
      return { k: p, t: p };
    }).concat([
      { k: 'nophase', t: 'Open, no phase', opt: 1 },
      { k: 'in', t: 'other (i.n. ...)', opt: 1 },
      { k: 'noopen', t: 'No open project', opt: 1 }
    ]),
    rows: CATEGORY_ROWS,
    // "Without P0" switch on: no P0 column (01 Current client alone; combined with Current demand it stays)
    hideCol: function (c) {
      return S.noP0 && c.k === P0_PHASE;
    },
    // an account goes in EVERY phase column where it has an open project (once per phase); its I.N.
    // shown I.N. / intercompany / excluded-from-pipeline / internal-owner projects (INTERNAL_KINDS) go in "other";
    // no open project at all = "No open project".
    // Totals count each account once (see render() in matrix/matrix-js)
    places: function (a) {
      var row = catKey(a.category);
      if (!a.open.length) return [[row, 'noopen']];
      return uniq(
        keptOpen(a).map(function (o) {
          return isInternal(o) ? 'in' : o.ph;
        })
      ).map(function (c) {
        return [row, c];
      });
    },
    place: function (a) {
      return this.places(a)[0];
    }
  },
  2: {
    title: 'Past clients',
    // past clients whose last project is less than 18 months ago (18+ months → map 05 Past business);
    // an account whose projects are ALL left out by "Real projects only" leaves the map
    filter: function (a) {
      return a.cls === 'past client' && pastCol(a) !== 3 && (!a.pj.length || keptProjects(a, false).length > 0);
    },
    x: 'Last project',
    y: 'Last meeting',
    cols: [
      { k: 0, t: '0–6 months' },
      { k: 1, t: '6–12 months' },
      { k: 2, t: '12–18 months' },
      { k: 'n', t: 'problematic', opt: 1 }
    ],
    rows: MEETING_ROWS,
    place: function (a) {
      return [band(mo(a.lastMeeting), [3, 6, 9, 12, 15, 18], 'n'), pastCol(a)];
    }
  },
  5: {
    title: 'Past business',
    // past clients whose last project is 18+ months ago, in ranges like map 02:
    // 1.5–2 years (18–24 months), 2–3 years, 3–4 years, 4+ years
    filter: function (a) {
      return a.cls === 'past client' && pastCol(a) === 3 && (!a.pj.length || keptProjects(a, false).length > 0);
    },
    x: 'Last project',
    y: 'Last meeting',
    cols: [
      { k: 'y2', t: '1.5–2 years' },
      { k: 'y3', t: '2–3 years' },
      { k: 'y4', t: '3–4 years' },
      { k: 'y5', t: '4+ years' },
      { k: 'yn', t: '18+ months, no date', opt: 1 }
    ],
    rows: MEETING_ROWS,
    place: function (a) {
      var m = mo(lastProjectDays(a));
      return [
        band(mo(a.lastMeeting), [3, 6, 9, 12, 15, 18], 'n'),
        m == null || m < 18 ? 'yn' : m < 24 ? 'y2' : m < 36 ? 'y3' : m < 48 ? 'y4' : 'y5'
      ];
    }
  },
  3: {
    // the 3 No business map cards above (NB_MAPS: Past demand, Met / contacted, New; S.nbCls, empty = all) pick
    // which classifications (columns) are counted; the columns not picked stay as empty space (the map keeps its size)
    get title() {
      return S.nbCls.length
        ? NB_MAPS.filter(function (m) {
            return S.nbCls.indexOf(m.k) >= 0;
          })
            .map(function (m) {
              return m.t;
            })
            .join(' + ')
        : 'No business';
    },
    filter: function (a) {
      return NB.indexOf(a.cls) >= 0 && (!S.nbCls.length || S.nbCls.indexOf(nbMap(a.cls)) >= 0);
    },
    colPick: function (c) {
      return !S.nbCls.length || S.nbCls.indexOf(nbMap(c.k)) >= 0;
    },
    x: 'Classification',
    y: 'Account category',
    cols: [
      { k: 'past demand', t: 'Past Demand' },
      { k: 'met in', t: 'Met In' },
      { k: 'met out', t: 'Met Out' },
      { k: 'contacted', t: 'Contacted' },
      { k: 'not contacted', t: 'Not Contacted' }
    ],
    rows: CATEGORY_ROWS,
    place: function (a) {
      return [catKey(a.category), a.cls];
    }
  },
  4: {
    title: 'All accounts',
    filter: function () {
      return true;
    },
    x: 'Classification',
    y: 'Account category',
    cols: [],
    rows: CATEGORY_ROWS,
    place: function (a) {
      return [catKey(a.category), a.cls];
    }
  }
};

// 06 Current demand: the accounts classified current demand (CURRENT_DEMAND in core/config-js) - the same layout as
// 01 Current client (category × phase of the open projects)
MAPS[6] = Object.assign({}, MAPS[1], {
  title: 'Current demand',
  hideCol: null, // demand = P0: its P0 column always shows
  filter: function (a) {
    return isDemand(a) && (!a.open.length || keptOpen(a).length > 0);
  }
});

/** Is the account current demand? (CURRENT_DEMAND in core/config-js) */
function isDemand(a) {
  return CURRENT_DEMAND(a);
}

// Two maps shown together (pick both cards): they share their layout, so their accounts go in one map.
//   16 = 01 Current client + 06 Current demand (same rows and columns)
//   25 = 02 Past clients + 05 Past business (same rows; the columns of both: 0–6 months … 4+ years)
MAPS[16] = Object.assign({}, MAPS[1], {
  title: 'Current client + Current demand',
  hideCol: null, // the demand accounts are in P0
  parts: [1, 6],
  filter: function (a) {
    return MAPS[1].filter(a) || MAPS[6].filter(a);
  }
});
MAPS[25] = Object.assign({}, MAPS[2], {
  title: 'Past clients + Past business',
  parts: [2, 5],
  filter: function (a) {
    return MAPS[2].filter(a) || MAPS[5].filter(a);
  },
  cols: MAPS[2].cols
    .filter(function (c) {
      return c.k !== 'n';
    })
    .concat(MAPS[5].cols, [{ k: 'n', t: 'problematic', opt: 1 }]),
  place: function (a) {
    return MAPS[2].filter(a) ? MAPS[2].place(a) : MAPS[5].place(a);
  }
});

/** The No business map (NB_MAPS key) of a classification. */
function nbMap(cls) {
  var m = NB_MAPS.filter(function (x) {
    return x.cls.indexOf(cls) >= 0;
  })[0];
  return m ? m.k : '';
}

// The Business maps (and their combinations): the "Recurrent only" switch applies to them
var BIZ_MAPS = [1, 6, 2, 5, 16, 25];

/** The map column of an account on Recurrent and Class A: the Business map it is on (1, 6, 2, 5), its No business
 *  map (NB_MAPS key), or 'none'. */
function mapCol(a) {
  var v = viewOf(a);
  return v === 3 ? nbMap(a.cls) : v === 4 ? 'none' : v;
}

var MAP_COLS = [
  { k: 1, t: 'Current client' },
  { k: 6, t: 'Current demand' },
  { k: 2, t: 'Past clients' },
  { k: 5, t: 'Past business' }
];

// 07 Recurrent (Business, a view of its own): the accounts with at least S.recN "new" projects in P1 or later, not lost
// (isRecurrent() in core/data-js; RECURRENT in core/config-js), by category × the Business map they are on
MAPS[7] = {
  title: 'Recurrent',
  filter: function (a) {
    return isRecurrent(a) && [1, 6, 2, 5].indexOf(viewOf(a)) >= 0;
  },
  x: 'Classification',
  y: 'Account category',
  cols: MAP_COLS,
  rows: CATEGORY_ROWS,
  place: function (a) {
    return [catKey(a.category), mapCol(a)];
  }
};

// 08 Class A: the accounts of the "class A" sheet (any map), by category × the map they are on
MAPS[8] = {
  title: 'Class A',
  filter: function (a) {
    return a.classA;
  },
  x: 'Classification',
  y: 'Account category',
  cols: MAP_COLS.concat(
    NB_MAPS.map(function (m) {
      return { k: m.k, t: m.t };
    }),
    [{ k: 'none', t: 'Not on a map', opt: 1 }]
  ),
  rows: CATEGORY_ROWS,
  place: function (a) {
    return [catKey(a.category), mapCol(a)];
  }
};

/** Is map n on screen (alone, or as part of a combined map)? */
function onView(n) {
  return S.view === n || (MAPS[S.view] && (MAPS[S.view].parts || []).indexOf(n) >= 0);
}

/** Where an account goes on a map: a list of [row, column] (more than one on map 01 with "All projects"). */
function placesOf(def, a) {
  return def.places ? def.places(a) : [def.place(a)];
}

/** The map an account is on: 01, 06, 02, 05 (Business) or 03 (No business); 4 = on none of them.
 *  (Recurrent 07 and Class A 08 are views across these maps, never an account's own map.) */
function viewOf(a) {
  var order = [1, 6, 2, 5, 3];
  for (var i = 0; i < order.length; i++) if (MAPS[order[i]].filter(a)) return order[i];
  return 4;
}
</script>
