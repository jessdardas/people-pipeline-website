<script>
/*
 * STAY IN TOUCH POLICY - website only.
 * The second view of the account list under the maps ("Account listing" | "Stay in touch policy", see
 * listBlock() in table/table-js). It shows the SAME accounts as the listing (the box / row / column picked on the
 * map, the search in the list, the column filters), one row each:
 * Columns: the account name, then only the weeks: WEEKS_BEFORE weeks before this week, this week, WEEKS_AFTER weeks after
 *     (core/config-js). Past weeks: the subjects of the account's activities ("activities" sheet), coloured by type
 *     (ACT_COLORS), tasks left out (ACT_HIDE). Next weeks: empty for now - later the to-dos.
 * (The touchpoints - last site visit, Pub 1, Pub 2 … - are in the pop-up, and as columns in Account listing with
 * the "touchpoints" switch. This view has no export.)
 * Clicking an account opens its account details.
 * Data: build() in core/data-js → acts(a) (actInfo), a.tp (touchpoints()), pubNums().
 */

/* ---------- weeks ---------- */

/** Monday of the week of Excel date number d (Excel date numbers count days; 25569 = 1 Jan 1970). */
function weekStart(d) {
  var day = new Date((Math.floor(d) - 25569) * 864e5).getUTCDay(); // 0 = Sunday
  return Math.floor(d) - ((day + 6) % 7);
}

/** ISO week number (W1 = the week with the year's first Thursday) of the week starting on Monday m. */
function isoWeek(m) {
  var thu = new Date((m + 3 - 25569) * 864e5),
    jan1 = Date.UTC(thu.getUTCFullYear(), 0, 1);
  return Math.floor((thu - jan1) / 864e5 / 7) + 1;
}

/** The weeks shown: [{ start (Monday, Excel date number), w (week number), off (−5 … +10, 0 = this week) }]. */
function tpWeeks() {
  var m0 = weekStart(todaySerial()),
    out = [];
  for (var k = -WEEKS_BEFORE; k <= WEEKS_AFTER; k++) out.push({ start: m0 + 7 * k, w: isoWeek(m0 + 7 * k), off: k });
  return out;
}

/** dd/mm of an Excel date number. */
function ddmm(d) {
  var x = new Date((d - 25569) * 864e5);
  return ('0' + x.getUTCDate()).slice(-2) + '/' + ('0' + (x.getUTCMonth() + 1)).slice(-2);
}

/* ---------- small pieces ---------- */

/** A read-only tick box (it shows a touchpoint; it can not be changed here). Drawn with CSS (.tpbox), because
 *  browsers grey out locked check boxes and a ticked one would hardly show. */
function tpBox(on) {
  return '<span class="tpbox' + (on ? ' on' : '') + '" title="' + (on ? 'done' : 'not yet') + '">' + (on ? '✓' : '') + '</span>';
}

/** A colour-coded activity label (colour = the type, ACT_COLORS).
 *  show = 'subject' (week cells: the subject, else the type) or anything else (the type: legend, pop-up, details). */
function actChip(x, show) {
  var c = actColor(x.type);
  return (
    '<span class="act" style="background:' +
    c.bg +
    ';color:' +
    c.fg +
    '" title="' +
    esc(fmtXl(x.date) + (x.type ? ' · ' + x.type : '') + (x.subject ? ' · ' + x.subject : '')) +
    '">' +
    esc(show === 'subject' ? x.subject || x.type || 'activity' : x.type || 'Activity') +
    '</span>'
  );
}

/** The colour legend: the activity types of these accounts. */
function actLegend(list) {
  var seen = {};
  list.forEach(function (a) {
    acts(a).forEach(function (x) {
      if (x.type) seen[x.type] = 1;
    });
  });
  var types = Object.keys(seen).sort();
  return types.length
    ? '<div class="actleg">' +
        types
          .map(function (t) {
            return actChip({ type: t, date: null, subject: '' });
          })
          .join('') +
        '</div>'
    : '';
}

/* ---------- the view ---------- */

/* ---------- week filter + sorting ----------
   Click a week title → a small menu with the activity types of that week (with how many accounts had each).
   Ticking types keeps only the accounts that had at least one of them in that week; the rows and weeks stay as
   they are (the filter only narrows the list). One week filter at a time; "clear" removes it. */

/** The activities of account a in the week starting on Monday m (no tasks). */
function actsInWeek(a, m) {
  return acts(a).filter(function (x) {
    return x.date != null && x.date >= m && x.date < m + 7;
  });
}

/** Does account a pass the week filter (S.wf)? */
function passWeek(a) {
  var f = S.wf;
  if (!f || !Object.keys(f.types).length) return true;
  return actsInWeek(a, f.start).some(function (x) {
    return f.types[x.type || 'Other'];
  });
}

/** Opens / closes the week menu of the week starting on Monday m. */
function weekMenu(m, e) {
  if (e) e.stopPropagation();
  S.wm = S.wm === m ? null : m;
  renderList();
}

/** Tick / untick an activity type in the week menu (the menu stays open). */
function weekType(m, t) {
  if (!S.wf || S.wf.start !== m) S.wf = { start: m, types: {} };
  if (S.wf.types[t]) delete S.wf.types[t];
  else S.wf.types[t] = 1;
  if (!Object.keys(S.wf.types).length) S.wf = null;
  renderList();
}

function clearWeek() {
  S.wf = null;
  S.wm = null;
  renderList();
}

/** The week menu (activity types of that week, for the accounts of the list). */
function weekMenuHtml(m, list) {
  var cnt = {};
  list.forEach(function (a) {
    var seen = {};
    actsInWeek(a, m).forEach(function (x) {
      var t = x.type || 'Other';
      if (!seen[t]) cnt[t] = (cnt[t] || 0) + 1;
      seen[t] = 1;
    });
  });
  var types = Object.keys(cnt).sort(),
    on = S.wf && S.wf.start === m ? S.wf.types : {};
  return (
    '<div class="wmenu" onclick="event.stopPropagation()"><div class="wm-h">Week ' +
    isoWeek(m) +
    ' · ' +
    esc(fmtXl(m)) +
    '</div>' +
    (types.length
      ? types
          .map(function (t) {
            var c = actColor(t);
            return (
              '<label><input type="checkbox" ' +
              (on[t] ? 'checked' : '') +
              ' onchange="weekType(' +
              m +
              ',\'' +
              esc(t).replace(/'/g, '&#39;') +
              '\')"><i style="background:' +
              c.bg +
              ';border-color:' +
              c.fg +
              '"></i>' +
              esc(t) +
              '<small>' +
              cnt[t] +
              '</small></label>'
            );
          })
          .join('')
      : '<p class="meta">No activities this week.</p>') +
    '<div class="wm-f"><button class="lnk" onclick="clearWeek()">clear</button><button class="lnk" onclick="weekMenu(' +
    m +
    ')">close</button></div></div>'
  );
}

/** Draws the Stay in touch policy table into box (the list block's #tw). list = the accounts of the listing. */
function renderStay(box, all) {
  var weeks = tpWeeks(),
    first = weeks[0].start,
    end = weeks[weeks.length - 1].start + 7,
    hasActs = S.sheets.some(function (s) {
      return s.role === 'activities';
    });
  if (S.wf && (S.wf.start < first || S.wf.start >= end)) S.wf = null; // the week is no longer shown
  var list = all.filter(passWeek); // same order as the listing (the shared "Sort by")
  // the colour legend goes on the right of the tools row (the same place in every view), no text above the table
  var leg = document.getElementById('dtLeg');
  if (leg) leg.innerHTML = actLegend(all);
  var h = hasActs ? '' : '<p class="meta">No "activities" sheet in the Excel file yet: the weeks stay empty.</p>';
  if (S.wf)
    h +=
      '<div class="wfbar">Week ' +
      isoWeek(S.wf.start) +
      ': ' +
      Object.keys(S.wf.types)
        .map(function (t) {
          return actChip({ type: t, date: null, subject: '' });
        })
        .join(' ') +
      ' <span class="meta">' +
      list.length +
      ' of ' +
      all.length +
      ' accounts</span><button class="lnk" onclick="clearWeek()">clear</button></div>';
  h +=
    '<div class="tpw"><table class="tb stay"><thead><tr>' +
    '<th class="acc">Account</th>' + // the only column besides the weeks (no #, no touchpoints)
    weeks
      .map(function (w) {
        var f = S.wf && S.wf.start === w.start;
        return (
          '<th class="wk' +
          (w.off === 0 ? ' now' : w.off > 0 ? ' next' : '') +
          (f ? ' wf' : '') +
          '" title="Week of ' +
          esc(fmtXl(w.start)) +
          ' - click to filter by activity type" data-w="' +
          w.start +
          '" onclick="weekMenu(' +
          w.start +
          ', event)">W' +
          w.w +
          (f ? ' ●' : '') +
          '<small>' +
          ddmm(w.start) +
          '</small></th>'
        );
      })
      .join('') +
    '</tr></thead><tbody>';
  list.slice(0, S.g.limit).forEach(function (a) {
    var inWin = acts(a).filter(function (x) {
      return x.date != null && x.date >= first && x.date < end;
    });
    h +=
      '<tr onclick="openDetail(' +
      a.i +
      ')" title="Click: account details">' +
      '<td class="acc"><b>' +
      esc(a.name) +
      '</b><small>' +
      esc([unitLabel(a.su), cap(a.cls)].filter(Boolean).join(' · ')) +
      '</small></td>' +
      weeks
        .map(function (w) {
          return (
            '<td class="wk' +
            (w.off === 0 ? ' now' : w.off > 0 ? ' next' : '') +
            (S.wf && S.wf.start === w.start ? ' wf' : '') +
            '">' +
            inWin
              .filter(function (x) {
                return x.date >= w.start && x.date < w.start + 7;
              })
              .map(function (x) {
                return actChip(x, 'subject'); // the subject; the colour tells the type (legend above)
              })
              .join('') +
            '</td>'
          );
        })
        .join('') +
      '</tr>';
  });
  h += '</tbody></table></div>';
  if (!list.length)
    h += '<p class="hint nomatch">No account matches' + (S.wf ? ' this week filter (clear it above).' : '. Try clearing the search or a column filter.') + '</p>';
  if (list.length > S.g.limit)
    h +=
      '<button class="more" onclick="S.g.limit+=200;renderList()">Show more (' +
      (list.length - S.g.limit).toLocaleString('en-GB') +
      ' left)</button>';
  box.innerHTML = h;
  placeWeekMenu(all);
}

/** Shows the open week menu as a floating box under its week title (outside the table, so it is never cut off). */
function placeWeekMenu(all) {
  var old = document.getElementById('wmenuBox');
  if (old) old.remove();
  if (S.wm == null) return;
  var th = document.querySelector('table.stay th[data-w="' + S.wm + '"]');
  if (!th) return;
  var r = th.getBoundingClientRect(),
    d = document.createElement('div');
  d.id = 'wmenuBox';
  d.innerHTML = weekMenuHtml(S.wm, all);
  d.style.cssText = 'position:absolute;z-index:80;top:' + (r.bottom + scrollY + 4) + 'px;left:' + Math.max(8, r.left + scrollX + r.width / 2 - 115) + 'px';
  document.body.appendChild(d);
}

// a click anywhere else closes the week menu (on "click", not "mousedown": closing it can shorten the page, and the
// button under the mouse must still get its click)
document.addEventListener('click', function (e) {
  if (S.wm != null && !e.target.closest('.wmenu') && !e.target.closest('th.wk')) {
    S.wm = null;
    var m = document.getElementById('wmenuBox');
    if (m) m.remove();
  }
});

/* ---------- the pop-up (used by the project pop-up in touch/touchpoints-js) ---------- */

function closeTouch() {
  S.tpOpen = null;
  var box = document.getElementById('tpop');
  if (box) box.classList.remove('open');
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeTouch();
});
</script>
