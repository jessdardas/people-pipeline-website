<script>
/*
 * STAY IN TOUCH POLICY - website only.
 * The second view of the account list under the maps ("Account listing" | "Stay in touch policy", see
 * listBlock() in table/table-js). It shows the SAME accounts as the listing (the box / row / column picked on the
 * map, the search in the list, the column filters), one row each:
 *   - one column per week: WEEKS_BEFORE weeks before this week, this week, WEEKS_AFTER weeks after
 *     (core/config-js). Past weeks: the subjects of the account's activities ("activities" sheet), coloured by type
 *     (ACT_COLORS), tasks left out (ACT_HIDE). Next weeks: empty for now - later the to-dos.
 * (The touchpoints - last site visit, Pub 1, Pub 2 … - are in the pop-up, and as columns in Account listing with
 * the "touchpoints" switch. This view has no export.)
 * Clicking an account opens the touchpoints pop-up: a to-do style checklist (site visit, Pub 1, Pub 2 …) and
 * what the account did (its activities).
 * Data: build() in core/data-js → a.activities (actInfo), a.tp (touchpoints()), pubNums().
 */

/* ---------- weeks ---------- */

/** Monday of the week of Excel date number d (Excel date numbers count days; 25569 = 1 Jan 1970). */
function weekStart(d) {
  var day = new Date((Math.floor(d) - 25569) * 864e5).getUTCDay(); // 0 = Sunday
  return Math.floor(d) - ((day + 6) % 7);
}

/** ISO week number (W1 = the week with the year's first Thursday) of the week starting on Monday m. */
function isoWeek(m) {
  var thu = new Date((m + 3 - 25569) * 864e5),
    jan1 = Date.UTC(thu.getUTCFullYear(), 0, 1);
  return Math.floor((thu - jan1) / 864e5 / 7) + 1;
}

/** The weeks shown: [{ start (Monday, Excel date number), w (week number), off (−5 … +10, 0 = this week) }]. */
function tpWeeks() {
  var m0 = weekStart(todaySerial()),
    out = [];
  for (var k = -WEEKS_BEFORE; k <= WEEKS_AFTER; k++) out.push({ start: m0 + 7 * k, w: isoWeek(m0 + 7 * k), off: k });
  return out;
}

/** dd/mm of an Excel date number. */
function ddmm(d) {
  var x = new Date((d - 25569) * 864e5);
  return ('0' + x.getUTCDate()).slice(-2) + '/' + ('0' + (x.getUTCMonth() + 1)).slice(-2);
}

/* ---------- small pieces ---------- */

/** A read-only tick box (it shows a touchpoint; it can not be changed here). Drawn with CSS (.tpbox), because
 *  browsers grey out locked check boxes and a ticked one would hardly show. */
function tpBox(on) {
  return '<span class="tpbox' + (on ? ' on' : '') + '" title="' + (on ? 'done' : 'not yet') + '">' + (on ? '✓' : '') + '</span>';
}

/** A colour-coded activity label (colour = the type, ACT_COLORS).
 *  show = 'subject' (week cells: the subject, else the type) or anything else (the type: legend, pop-up, details). */
function actChip(x, show) {
  var c = actColor(x.type);
  return (
    '<span class="act" style="background:' +
    c.bg +
    ';color:' +
    c.fg +
    '" title="' +
    esc(fmtXl(x.date) + (x.type ? ' · ' + x.type : '') + (x.subject ? ' · ' + x.subject : '')) +
    '">' +
    esc(show === 'subject' ? x.subject || x.type || 'activity' : x.type || 'Activity') +
    '</span>'
  );
}

/** The colour legend: the activity types of these accounts. */
function actLegend(list) {
  var seen = {};
  list.forEach(function (a) {
    a.activities.forEach(function (x) {
      if (x.type) seen[x.type] = 1;
    });
  });
  var types = Object.keys(seen).sort();
  return types.length
    ? '<div class="actleg">' +
        types
          .map(function (t) {
            return actChip({ type: t, date: null, subject: '' });
          })
          .join('') +
        '</div>'
    : '';
}

/* ---------- the view ---------- */

/** Draws the Stay in touch policy table into box (the list block's #tw). list = the accounts of the listing. */
function renderStay(box, list) {
  var weeks = tpWeeks(),
    hasActs = S.sheets.some(function (s) {
      return s.role === 'activities';
    });
  var h =
    '<div class="stay-info">' +
    (hasActs
      ? 'Past weeks: the subject of each activity, coloured by type (no tasks) · hover for the details · this week highlighted · next weeks: to-dos (coming later)'
      : 'No "activities" sheet in the Excel file yet: the weeks stay empty.') +
    '</div>' +
    actLegend(list) +
    '<div class="tpw"><table class="tb stay"><thead><tr>' +
    '<th class="cnt">#</th><th class="acc">Account</th>' +
    weeks
      .map(function (w) {
        return (
          '<th class="wk' +
          (w.off === 0 ? ' now' : w.off > 0 ? ' next' : '') +
          '" title="Week of ' +
          esc(fmtXl(w.start)) +
          '">W' +
          w.w +
          '<small>' +
          ddmm(w.start) +
          '</small></th>'
        );
      })
      .join('') +
    '</tr></thead><tbody>';
  var first = weeks[0].start,
    end = weeks[weeks.length - 1].start + 7;
  list.slice(0, S.g.limit).forEach(function (a, n) {
    var inWin = a.activities.filter(function (x) {
      return x.date != null && x.date >= first && x.date < end;
    });
    h +=
      '<tr onclick="openTouch(' +
      a.i +
      ')" title="Click: touchpoints of this account">' +
      '<td class="cnt">' +
      (n + 1) +
      '</td><td class="acc"><b>' +
      esc(a.name) +
      '</b><small>' +
      esc([unitLabel(a.su), cap(a.cls)].filter(Boolean).join(' · ')) +
      '</small></td>' +
      weeks
        .map(function (w) {
          return (
            '<td class="wk' +
            (w.off === 0 ? ' now' : w.off > 0 ? ' next' : '') +
            '">' +
            inWin
              .filter(function (x) {
                return x.date >= w.start && x.date < w.start + 7;
              })
              .map(function (x) {
                return actChip(x, 'subject'); // the subject; the colour still tells the type (legend above)
              })
              .join('') +
            '</td>'
          );
        })
        .join('') +
      '</tr>';
  });
  h += '</tbody></table></div>';
  if (!list.length) h += '<p class="hint nomatch">No account matches. Try clearing the search or a column filter.</p>';
  if (list.length > S.g.limit)
    h +=
      '<button class="more" onclick="S.g.limit+=200;renderList()">Show more (' +
      (list.length - S.g.limit).toLocaleString('en-GB') +
      ' left)</button>';
  box.innerHTML = h;
}

/* ---------- the touchpoints pop-up (to-do style) ---------- */

/** Opens the pop-up of account i: the touchpoints as a checklist + what the account did (activities). */
function openTouch(i) {
  var a = S.acc[i];
  if (!a) return;
  S.tpOpen = i;
  var pubs = pubNums(),
    item = function (on, title, sub) {
      return (
        '<li class="' +
        (on ? 'done' : '') +
        '">' +
        tpBox(on) +
        '<div><b>' +
        esc(title) +
        '</b>' +
        (sub ? '<small>' + esc(sub) + '</small>' : '') +
        '</div></li>'
      );
    };
  var h =
    '<div class="tpop-h"><div><h3>' +
    esc(a.name) +
    '</h3><div class="meta">' +
    esc([unitLabel(a.su), cap(a.cls), cap(a.category)].filter(Boolean).join(' · ')) +
    '</div></div><button class="tpop-x" onclick="closeTouch()" title="Close">×</button></div>';
  // 1. the checklist
  h +=
    '<h4>Touchpoints</h4><ul class="todo">' +
    item(
      a.tp.visit,
      'Site visit',
      a.tp.visitDate
        ? 'last on ' + fmtXl(a.tp.visitDate) + (a.tp.visitWhy ? ' · ' + a.tp.visitWhy : '')
        : a.tp.visit
          ? a.tp.visitWhy
          : 'no site visit yet'
    ) +
    pubs
      .map(function (n) {
        var l = a.tp.pub[n] || [];
        return item(l.length > 0, 'Pub ' + n, l.length ? pubText(l) || 'done' : 'not yet');
      })
      .join('') +
    (pubs.length ? '' : '<li class="none">No publication columns (pslab_publication1, 2 …) in the file yet.</li>') +
    '</ul>';
  // 2. what the account did (newest first, colour-coded, no tasks)
  h +=
    '<h4>What they did <span>(' +
    a.activities.length +
    ')</span></h4>' +
    (a.activities.length
      ? '<ul class="acts">' +
        a.activities
          .slice(0, 40)
          .map(function (x) {
            return (
              '<li><span class="d">' +
              esc(x.date ? fmtXl(x.date) : '—') +
              '</span>' +
              actChip(x, true) +
              '<span class="s">' +
              esc(x.subject) +
              '</span></li>'
            );
          })
          .join('') +
        '</ul>' +
        (a.activities.length > 40 ? '<p class="meta">… and ' + (a.activities.length - 40) + ' older</p>' : '')
      : '<p class="meta">No activities yet.</p>');
  // 3. next: the to-dos (later)
  h +=
    '<h4>Next</h4><p class="meta">The to-dos (what should happen next) will show here.</p>' +
    '<div class="tpop-f"><button class="btn ghost" onclick="closeTouch();openDetail(' +
    a.i +
    ')">Open account details</button></div>';
  var box = document.getElementById('tpop');
  if (!box) {
    box = document.createElement('div');
    box.id = 'tpop';
    box.className = 'tpop-dim';
    box.onclick = function (e) {
      if (e.target === box) closeTouch();
    };
    document.body.appendChild(box);
  }
  box.innerHTML = '<div class="tpop">' + h + '</div>';
  box.classList.add('open');
}

function closeTouch() {
  S.tpOpen = null;
  var box = document.getElementById('tpop');
  if (box) box.classList.remove('open');
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeTouch();
});
</script>
