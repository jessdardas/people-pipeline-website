<script>
/*
 * TOUCHPOINTS - website only. ONE implementation, used in:
 *   1. the "Touchpoints" view of the list under map 01 Current pipeline (renderTpTab): # | Project | Phase | Accounts,
 *      one row per unique open project, with the number of projects in the list title.
 *      Click a project: a table opens right under it - its accounts as rows, the touchpoints of a phase as columns
 *      (standard: the current phase; the phase buttons show the others), a tick box per account.
 *   2. the project pop-up (openProject, from the account details): the same table for every phase,
 *      the current phase first, then the previous ones, then the upcoming ones
 *   3. the account details (tpAccountHtml): Account → Projects → Phase → that account's tick boxes
 * The reference (names, groups, types, phases) is TOUCHPOINTS / TP_GROUPS in core/config-js.
 * Every tick box is round (the type - added value / deliverable - is not shown). Colour = group (soft shades).
 * A tick belongs to one ACCOUNT on one PROJECT (tpChecked). For now on screen only (S.tpTemp, never saved, a reload
 * clears it). Later: TP_SOURCE (from the database) + TP_READONLY in core/config-js - then no ticking by hand.
 * "Real projects only" (core/data-js): internal accounts are gone (hiddenAcc), left-out projects are not shown.
 */

/* ---------- the reference ---------- */

function tpGroup(k) {
  return (
    TP_GROUPS.filter(function (g) {
      return g.k === k;
    })[0] || { k: k, t: k, c: '#999', l: '#eee' }
  );
}

/** Does touchpoint t apply to phase ph? ('nophase' → only the "any phase" ones) */
function tpApplies(t, ph) {
  return t.ph === 'any' || (PHASES.indexOf(ph) >= 0 && t.ph.indexOf(ph) >= 0);
}

/** The touchpoints that apply to phase ph, in reference order ('all' = every touchpoint of every phase). */
function tpFor(ph) {
  return TOUCHPOINTS.filter(function (t) {
    return ph === 'all' || tpApplies(t, ph);
  });
}

/** Is this a real project (not left out by "Real projects only")? The P0 switch is not used here. */
function realProject(o) {
  return !(
    S.clean &&
    PROJECT_EXCLUDE.some(function (e) {
      return S.px[e.k] && o[e.k];
    })
  );
}

function phaseLabel(ph) {
  return ph === 'nophase' ? 'No phase' : ph === 'all' ? 'All' : ph;
}

/** The visible accounts of a project ("Real projects only" removes internal accounts), A→Z. */
function prjAccounts(x) {
  return x.accs
    .map(function (i) {
      return S.acc[i];
    })
    .filter(function (a) {
      return a && !hiddenAcc(a);
    })
    .sort(function (p, q) {
      return p.name.localeCompare(q.name);
    });
}

/* ---------- ticked or not: one account on one project (the future database hooks in here) ---------- */

function tpKey(pk, a, tk) {
  return pk + '|' + a.id + '|' + tk;
}

function tpChecked(pk, a, tk) {
  if (TP_SOURCE) return !!TP_SOURCE(pk, a.id, tk);
  return !!S.tpTemp[tpKey(pk, a, tk)];
}

/** A click on a tick box: tick / untick on screen only (nothing is saved). Read-only once TP_READONLY is set. */
function tpClick(el, e) {
  if (e) e.stopPropagation();
  if (TP_READONLY || TP_SOURCE) return;
  var key = el.getAttribute('data-tp');
  if (S.tpTemp[key]) delete S.tpTemp[key];
  else S.tpTemp[key] = 1;
  // the same box may be on screen twice (list + pop-up / details): update every copy
  document.querySelectorAll('[data-tp]').forEach(function (b) {
    if (b.getAttribute('data-tp') === key) b.classList.toggle('on', !!S.tpTemp[key]);
  });
}

/* ---------- small pieces ---------- */

/** A tick box: shape by type (○ round / □ square), filled with the group shade when ticked. */
function tpTick(pk, a, t) {
  var g = tpGroup(t.g);
  return (
    '<button class="tpk' +
    (tpChecked(pk, a, t.k) ? ' on' : '') +
    (TP_READONLY || TP_SOURCE ? ' ro' : '') +
    '" data-tp="' +
    esc(tpKey(pk, a, t.k)) +
    '" style="--gc:' +
    g.c +
    '" onclick="tpClick(this,event)" title="' +
    esc(a.name + ' · ' + t.t) +
    '"></button>'
  );
}

/** Legend: the group shades. */
function tpLegendHtml() {
  return (
    '<div class="tpleg">' +
    TP_GROUPS.map(function (g) {
      return '<span class="tplg" style="--gc:' + g.c + ';--gl:' + g.l + '"><i></i>' + esc(g.t) + '</span>';
    }).join('') +

    '</div>'
  );
}

/* ---------- the accounts × touchpoints table of one project (both looks, the pop-up) ---------- */

/** Accounts as rows, the touchpoints of phase ph as columns (grouped, with the group shade), a tick box each. */
function tpMatrixHtml(x, ph) {
  var accs = prjAccounts(x),
    list = tpFor(ph);
  if (!list.length) return '<p class="meta">No touchpoints for this phase.</p>';
  var groups = TP_GROUPS.map(function (g) {
    return {
      g: g,
      tps: list.filter(function (t) {
        return t.g === g.k;
      })
    };
  }).filter(function (x) {
    return x.tps.length;
  });
  var h =
    '<div class="tpmw"><table class="tpm"><thead><tr><th class="ma" rowspan="2">Account</th>' +
    groups
      .map(function (x) {
        return '<th class="mg" colspan="' + x.tps.length + '" style="--gc:' + x.g.c + ';--gl:' + x.g.l + '" title="' + esc(x.g.t) + '">' + esc(x.g.t) + '</th>';
      })
      .join('') +
    '</tr><tr>' +
    groups
      .map(function (x) {
        return x.tps
          .map(function (t) {
            return (
              '<th class="mt" style="--gl:' +
              x.g.l +
              '" title="' +
              esc(t.t + ' · ' + (t.ph === 'any' ? 'any phase' : t.ph.join(', '))) +
              '">' +
              esc(t.t) +
              '</th>'
            );
          })
          .join('');
      })
      .join('') +
    '</tr></thead><tbody>';
  accs.forEach(function (a) {
    h +=
      '<tr><td class="ma"><button class="lnk" onclick="event.stopPropagation();openDetail(' +
      a.i +
      ')">' +
      esc(a.name) +
      '</button><small>' +
      esc(cap(a.category) || '—') +
      '</small></td>' +
      groups
        .map(function (gx) {
          return gx.tps
            .map(function (t) {
              return '<td class="mc">' + tpTick(x.id, a, t) + '</td>';
            })
            .join('');
        })
        .join('') +
      '</tr>';
  });
  return h + '</tbody></table></div>';
}

/** The opened part under a project row: phase buttons (current marked) + the accounts × touchpoints table. */
function tpOpenHtml(x) {
  var ph = S.tpPh[x.id] || x.ph,
    jsId = esc(x.id).replace(/'/g, '&#39;');
  return (
    '<div class="tpx-h"><span class="meta">Phase</span>' +
    (PHASES.indexOf(x.ph) < 0 ? ['nophase'] : [])
      .concat(PHASES, ['all'])
      .map(function (p) {
        return (
          '<button class="tpphb' +
          (p === ph ? ' on' : '') +
          (p === x.ph ? ' cur' : '') +
          '" onclick="event.stopPropagation();tpSetPh(\'' +
          jsId +
          "','" +
          p +
          '\')" title="' +
          (p === x.ph ? 'current phase' : '') +
          '">' +
          esc(phaseLabel(p)) +
          '</button>'
        );
      })
      .join('') +
    '<span class="meta">' +
    (ph === x.ph ? 'current phase' : ph === 'all' ? 'all touchpoints of every phase' : 'the current phase is ' + esc(phaseLabel(x.ph))) +
    '</span></div>' +
    tpMatrixHtml(x, ph)
  );
}

function tpSetPh(id, ph) {
  S.tpPh[id] = ph;
  tpRefresh();
}

/** Draw the project tables again where they are on screen: the Touchpoints view and / or the account details. */
function tpRefresh() {
  if (S.listView === 'tp' && document.getElementById('tw')) renderList();
  renderDetProjects();
}

/* ---------- 1. the Touchpoints view (Current pipeline): # | Project | Phase | Accounts ---------- */

/** The unique open real projects of the listed accounts, A→Z. */
function tpProjects(list) {
  var seen = {},
    out = [];
  list.forEach(function (a) {
    keptOpen(a).forEach(function (o) {
      if (seen[o.id] || !realProject(o)) return;
      seen[o.id] = 1;
      out.push(S.prj[o.id]);
    });
  });
  // the shared "Sort by": Account name → projects A→Z; any other sort → in the order of their first listed account
  if (S.g.sort.k === 'name')
    return out.sort(function (x, y) {
      return x.name.localeCompare(y.name) * S.g.sort.d;
    });
  return out;
}

/** Open / close a project's table (click on its row). The Touchpoints view and the account details each keep
 *  their own opened projects (S.tpOpenP / S.tpOpenD), so one never opens rows in the other. */
function tpToggle(id, ctx) {
  var o = ctx === 'det' ? S.tpOpenD : S.tpOpenP;
  if (o[id]) delete o[id];
  else o[id] = 1;
  tpRefresh();
}

/** Close every opened project of the Touchpoints view and forget the picked phases (the standard view). */
function tpReset() {
  S.tpOpenP = {};
  S.tpPh = {};
}

/** The accounts of a project, one under the other: "Account | Category". */
function tpAccList(x) {
  return (
    '<ul class="pacc">' +
    prjAccounts(x)
      .map(function (a) {
        return '<li><b>' + esc(a.name) + '</b> <span class="meta">| ' + esc(cap(a.category) || '—') + '</span></li>';
      })
      .join('') +
    '</ul>'
  );
}

function renderTpTab(box, list) {
  var prj = tpProjects(list);
  // the list title says how many projects (and of how many accounts)
  var c = document.getElementById('gCount');
  if (c)
    c.textContent =
      prj.length.toLocaleString('en-GB') +
      ' project' +
      (prj.length === 1 ? '' : 's') +
      ' · ' +
      list.length.toLocaleString('en-GB') +
      ' account' +
      (list.length === 1 ? '' : 's');
  // the group colours go on the right of the tools row (the same place in every view), no text above the table
  var leg = document.getElementById('dtLeg');
  if (leg) leg.innerHTML = tpLegendHtml();
  var h = tpProjTable(prj.slice(0, S.g.limit));
  if (!prj.length) h += '<p class="hint nomatch">No open real projects for these accounts.</p>';
  if (prj.length > S.g.limit)
    h +=
      '<button class="more" onclick="S.g.limit+=200;renderList()">Show more (' +
      (prj.length - S.g.limit).toLocaleString('en-GB') +
      ' left)</button>';
  box.innerHTML = h;
}

/** The project table (Touchpoints view and account details): # | Project | Phase | Accounts; a click on a project
 *  opens its accounts × touchpoints table right under it. */
function tpProjTable(prj, ctx) {
  var opened = ctx === 'det' ? S.tpOpenD : S.tpOpenP;
  var h =
    '<div class="tw tpw2"><table class="tb tpcomp"><thead><tr><th class="cnt">#</th><th class="pj">Project</th><th class="ph">Phase</th><th class="pa">Accounts</th></tr></thead><tbody>';
  prj.forEach(function (x, n) {
    var open = !!opened[x.id],
      jsId = esc(x.id).replace(/'/g, '&#39;');
    h +=
      '<tr class="tpr' +
      (open ? ' open' : '') +
      '" onclick="tpToggle(\'' +
      jsId +
      "','" +
      (ctx || '') +
      '\')" title="Click to ' +
      (open ? 'close' : 'open') +
      ' the accounts × touchpoints table"><td class="cnt">' +
      (n + 1) +
      '</td><td class="pj"><span class="caret">' +
      (open ? '▾' : '▸') +
      '</span><b>' +
      esc(x.name || '(no name)') +
      '</b>' +
      (x.open ? '' : ' <span class="meta">closed</span>') +
      '</td><td class="ph"><span class="phb">' +
      esc(phaseLabel(x.ph)) +
      '</span></td><td class="pa">' +
      tpAccList(x) +
      '</td></tr>';
    if (open) h += '<tr class="tpx"><td colspan="4">' + tpOpenHtml(x) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

/* ---------- 2. the project pop-up: the table for every phase - current first, then previous, then upcoming ---------- */

function phaseOrder(ph) {
  var i = PHASES.indexOf(ph);
  if (i < 0) return ['nophase'].concat(PHASES);
  return [ph].concat(PHASES.slice(0, i).reverse(), PHASES.slice(i + 1));
}

function openProject(id) {
  var x = S.prj[id];
  if (!x) return;
  var i = PHASES.indexOf(x.ph);
  var h =
    '<div class="tpop-h"><div><h3>' +
    esc(x.name || '(no name)') +
    '</h3><div class="meta">Current phase <b>' +
    esc(phaseLabel(x.ph)) +
    '</b> · ' +
    (x.open ? 'open' : 'closed') +
    '</div></div><button class="tpop-x" onclick="closeTouch()" title="Close">×</button></div>' +
    tpLegendHtml();
  phaseOrder(x.ph).forEach(function (ph, n) {
    var j = PHASES.indexOf(ph),
      tag = n === 0 ? 'current phase' : i >= 0 && j < i ? 'previous phase' : i >= 0 ? 'upcoming phase' : '';
    h +=
      '<section class="tpph' +
      (n === 0 ? ' cur' : '') +
      '"><h4>' +
      esc(phaseLabel(ph)) +
      (tag ? ' <span>' + tag + '</span>' : '') +
      '</h4>' +
      tpMatrixHtml(x, ph) +
      '</section>';
  });
  showPop(h, 'wide');
}

/** Shows html in the pop-up (the same pop-up as the Stay in touch touchpoints, touch/touch-js). */
function showPop(html, size) {
  var box = document.getElementById('tpop');
  if (!box) {
    box = document.createElement('div');
    box.id = 'tpop';
    box.className = 'tpop-dim';
    box.onclick = function (e) {
      if (e.target === box) closeTouch();
    };
    document.body.appendChild(box);
  }
  box.innerHTML = '<div class="tpop' + (size ? ' ' + size : '') + '">' + html + '</div>';
  box.classList.add('open');
}

/* ---------- 3. account details: the account's real projects in the same table (# | Project | Phase | Accounts) ---- */

/** The account's real projects (each once): open ones first, then by phase (latest first), then A→Z. */
function accProjects(a) {
  var seen = {};
  return a.pj
    .filter(function (o) {
      if (seen[o.id] || !realProject(o)) return false;
      seen[o.id] = 1;
      return true;
    })
    .map(function (o) {
      return S.prj[o.id];
    })
    .sort(function (x, y) {
      return y.open - x.open || PHASES.indexOf(y.ph) - PHASES.indexOf(x.ph) || x.name.localeCompare(y.name);
    });
}

/** The Projects section of the details panel (drawn into #dPrj so it can be redrawn on its own). */
function tpAccountHtml(a) {
  S.tpOpenD = {}; // a newly opened account starts with all its projects closed
  return '<div id="dPrj" data-i="' + a.i + '">' + tpAccountInner(a) + '</div>';
}

function tpAccountInner(a) {
  var list = accProjects(a);
  return list.length ? tpLegendHtml() + tpProjTable(list, 'det') : '<p class="meta">No projects.</p>';
}

/** Redraws the Projects section of the open account details (after opening a project or picking a phase). */
function renderDetProjects() {
  var box = document.getElementById('dPrj');
  if (!box || !document.getElementById('drawer').classList.contains('open')) return;
  var a = S.acc[+box.getAttribute('data-i')];
  var closed = box.querySelector('table.collapsed');
  box.innerHTML = tpAccountInner(a);
  addCollapse(box);
  if (closed) box.querySelector('table.tb').classList.add('collapsed');
}
</script>
