<script>
/* Turns the server data into one object per account */
function cv(si, c, j) {
  var col = S.sheets[si].cols[c],
    v = col.v[j];
  if (col.d) return v == null || v < 0 ? null : col.d[v];
  return v;
}

var FIELD = {};

function F(a, key) {
  var f = FIELD[hKey(key)];
  if (!f) return null;
  var j = f.s === 0 ? a.i : a.mr[f.s];
  return j == null ? null : cv(f.s, f.c, j);
}

function valBucket(v) {
  if (!v) return 'No value';
  for (var i = 0; i < VAL_EDGES.length; i++) if (v < VAL_EDGES[i]) return VAL_LABELS[i];
  return VAL_LABELS[VAL_LABELS.length - 1];
}

function cntBucket(n) {
  n = n || 0;
  return n === 0
    ? '0'
    : n === 1
      ? '1'
      : n <= 3
        ? '2–3'
        : n <= 5
          ? '4–5'
          : n <= 10
            ? '6–10'
            : n <= 20
              ? '11–20'
              : '21+';
}

function prjBucket(n) {
  return n === 0 ? 'None' : n === 1 ? '1' : n <= 5 ? '2–5' : n <= 10 ? '6–10' : '11+';
}

function daysFrom(dateKey, daysKey, a) {
  var d = num(F(a, dateKey));
  if (d == null || d <= NEVER) return { date: null, days: null };
  var n = daysKey ? num(F(a, daysKey)) : null;
  return {
    date: d,
    days: n != null ? Math.max(0, Math.round(n)) : Math.max(0, Math.round(todaySerial() - d))
  };
}

function build(d) {
  if (!S._pxSet) {
    S.px = defaultPx(); // standard choice of the "Real projects only" ▾ menu (once; later choices are kept)
    S._pxSet = true;
  }
  S.source = d.source || {};
  S.pubNums = null; // publication numbers are worked out again for the new data (pubNums())
  if (d.settings) S.settings = d.settings;
  S.checked = Date.now();
  S.sheets = d.sheets;
  S.sheets.forEach(function (s, si) {
    s.si = si;
    s.hk = s.cols.map(function (c) {
      return hKey(c.h);
    });
  });
  FIELD = {};
  S.sheets.forEach(function (s) {
    if (s.role !== 'accounts' && s.role !== 'merge') return;
    s.hk.forEach(function (h, c) {
      if (!FIELD[h]) FIELD[h] = { s: s.si, c: c };
    });
  });
  var n = S.sheets[0].n,
    acc = new Array(n);
  for (var i = 0; i < n; i++) acc[i] = { i: i, mr: {}, L: {} };
  S.sheets.forEach(function (s) {
    if (s.role === 'accounts') return;
    for (var j = 0; j < s.n; j++) {
      var a = acc[s.link[j]];
      if (!a) continue;
      if (s.role === 'merge') a.mr[s.si] = j;
      else (a.L[s.si] = a.L[s.si] || []).push(j);
    }
  });
  S.byId = {};
  // "last validated": the validation end date column (validation_task_enddate), else any date column about validation
  var vk = Object.keys(FIELD);
  S.validKey =
    vk.filter(function (k) {
      return /validat/.test(k) && /enddate/.test(k);
    })[0] ||
    vk.filter(function (k) {
      return /validat/.test(k) && /date|on$/.test(k);
    })[0] ||
    null;
  // the city column: "city", else any account column with "city" in its name (e.g. address1_city)
  S.cityKey = FIELD.city
    ? 'city'
    : Object.keys(FIELD).filter(function (k) {
        return /city/.test(k);
      })[0] || null;
  // the website column: websiteurl / website / webpage / url (account sheets), shown in the details overview
  S.webKey =
    ['websiteurl', 'website', 'webpage', 'webadress', 'webaddress', 'url'].filter(function (k) {
      return FIELD[k];
    })[0] ||
    Object.keys(FIELD).filter(function (k) {
      return /website|webpage/.test(k);
    })[0] ||
    null;
  acc.forEach(function (a) {
    a.id = String(F(a, 'accountid') || '');
    a.name = String(F(a, 'name') == null ? '(no name)' : F(a, 'name'));
    a.lname = a.name.toLowerCase();
    a.cls = lc(F(a, 'classification')) || 'no classification';
    a.clsOrder = num(F(a, 'classification_order'));
    a.category = lc(F(a, 'category'));
    a.orig = lc(F(a, 'original_category'));
    a.industry = F(a, 'industry') == null ? '' : String(F(a, 'industry')).trim();
    a.country = lc(F(a, 'country'));
    a.website = S.webKey ? String(F(a, S.webKey) == null ? '' : F(a, S.webKey)).trim() : '';
    a.city = S.cityKey ? String(F(a, S.cityKey) == null ? '' : F(a, S.cityKey)).trim() : ''; // city column (see cityKey below)
    a.su = suKey(F(a, 'serviceunit'));
    a.owner = F(a, 'owneridname') == null ? '' : String(F(a, 'owneridname'));
    a.metIn = lc(F(a, 'met in')) === 'yes' ? 'yes' : 'no';
    var lm = daysFrom('LastMeeting_Date', 'LastMeeting_days', a),
      lp = daysFrom('LastProject_DateIn', 'LastProject_days', a),
      lcn = daysFrom('LastContact1_Date', null, a);
    a.lmDate = lm.date;
    a.lastMeeting = lm.days;
    a.lpDate = lp.date;
    a.lastProject = lp.days;
    a.lcDate = lcn.date;
    a.lastContact = lcn.days;
    a.phase = phaseKey(F(a, 'Phase_Group'));
    a.pipe = pipeKey(F(a, 'pipeline'));
    a.preN = num(F(a, 'PreP1_Count')) || 0;
    a.postN = num(F(a, 'PostP1_Count')) || 0;
    a.postV = num(F(a, 'PostP1_Amount')) || 0;
    a.cur = F(a, 'CurrencySymbol') || '€';
    a.pb = String(F(a, 'classification2') == null ? '' : F(a, 'classification2'));
    var vd = S.validKey ? F(a, S.validKey) : null;
    if (typeof vd === 'string' && /^\d+(\.\d+)?$/.test(vd.trim())) vd = Number(vd); // an Excel date number stored as text
    if (typeof vd === 'string') {
      var pd = Date.parse(vd);
      vd = isNaN(pd) ? null : pd / 864e5 + 25569;
    }
    a.validDate = vd != null && vd > NEVER ? vd : null;
    a.validDays = a.validDate == null ? null : Math.max(0, Math.round(todaySerial() - a.validDate));
    a.social = [];
    a.projects = [];
    a.contacts = [];
    a.acts = []; // rows of the "activities" sheet (Touchpoints view)
    a.lists = [];
    Object.keys(a.L).forEach(function (si) {
      var s = S.sheets[si];
      a.L[si].forEach(function (j) {
        if (s.role === 'social') {
          if (rowHasContent(s, j)) a.social.push({ s: +si, j: j });
        } else if (s.role === 'projects') a.projects.push({ s: +si, j: j });
        else if (s.role === 'contacts') a.contacts.push({ s: +si, j: j });
        else if (s.role === 'activities') a.acts.push({ s: +si, j: j });
        else a.lists.push({ s: +si, j: j });
      });
    });
    // every project with its kind flags (PROJECT_EXCLUDE), phase, open or not and date - used by maps 01 + 02
    a.pj = a.projects.map(function (p) {
      var ph = phaseKey(cellBy(p.s, p.j, 'Phase_Group')),
        nm = String(projName(p)),
        o = { ph: PHASES.indexOf(ph) >= 0 ? ph : 'nophase', open: isOpenProject(p), date: projDate(p) };
      PROJECT_EXCLUDE.forEach(function (e) {
        o[e.k] = e.name
          ? e.name.test(nm) || e.name.test(a.name)
          : e.owner
            ? e.owner.test(projOwner(p))
            : projFlag(p, e);
      });
      return o;
    });
    a.open = a.pj.filter(function (o) {
      return o.open;
    });
    // "last project" empty in the file: take the latest date of the account's own projects
    a.lpFromProj = false;
    if (a.lpDate == null) {
      var lp2 = latestDate(a.pj);
      if (lp2 != null) {
        a.lpDate = lp2;
        a.lastProject = Math.max(0, Math.round(todaySerial() - lp2));
        a.lpFromProj = true;
      }
    }
    // touchpoints (app/touch/): activities (without tasks, ACT_HIDE), last site visit, Pub 1 / Pub 2 / …
    a.activities = a.acts
      .map(actInfo)
      .filter(function (x) {
        return !ACT_HIDE.test(x.type || x.subject);
      })
      .sort(function (x, y) {
        return (y.date || 0) - (x.date || 0);
      });
    a.acts = a.activities.map(function (x) {
      return x.e; // the details panel shows the same rows (no tasks)
    });
    a.tp = touchpoints(a);
    a.projPhases = uniq(
      a.projects
        .map(function (p) {
          return phaseKey(cellBy(p.s, p.j, 'Phase_Group'));
        })
        .filter(Boolean)
    ).sort();
    a.fv = {
      cls: a.cls,
      cat: a.category || '(none)',
      orig: a.orig || '(none)',
      ind: a.industry || '(none)',
      country: a.country || '(none)',
      owner: a.owner || '(none)',
      metin: a.metIn,
      phase: a.phase || 'No phase',
      val: valBucket(a.postV),
      postn: cntBucket(a.postN),
      pren: cntBucket(a.preN),
      proj: prjBucket(a.projects.length),
      valid: a.validDays == null ? 'Not validated' : lmBucket(a.validDays)
    };
    if (a.id) S.byId[a.id] = a;
  });
  S.acc = acc;
  var co = {};
  acc.forEach(function (a) {
    if (co[a.cls] == null) co[a.cls] = a.clsOrder == null ? 99 : a.clsOrder;
  });
  MAPS[4].cols = Object.keys(co)
    .sort(function (x, y) {
      return co[x] - co[y];
    })
    .map(function (c) {
      // "No classification" only shows when the selection has accounts without a classification
      return { k: c, t: cap(c), opt: c === 'no classification' ? 1 : 0 };
    });
  // units present in data
  var have = {};
  acc.forEach(function (a) {
    if (a.su) have[a.su] = (have[a.su] || 0) + 1;
  });
  S.have = have;
  S.allUnits = UNIT_ORDER.concat(
    Object.keys(have)
      .filter(function (u) {
        return UNIT_ORDER.indexOf(u) < 0;
      })
      .sort()
  );
  buildSocialFilters();
  makeTpCols(); // touchpoint columns of the account table (Last site visit, Pub 1, Pub 2 …)
}

/** Is the project marked in the PROJECT_EXCLUDE column of kind e? */
function projFlag(p, e) {
  var hk = S.sheets[p.s].hk,
    c = -1;
  for (var i = 0; i < hk.length; i++)
    if (e.col.test(hk[i])) {
      c = i;
      break;
    }
  if (c < 0) return false;
  var v = cv(p.s, c, p.j);
  if (v == null || v === false || v === 0) return false;
  return !/^(|no|n|false|0|-|none)$/i.test(String(v).trim());
}

/* ---------- touchpoints (used by app/touch/touch-js and the account table) ---------- */

/** The column of sheet s for one of ACT_COLS ('date' / 'type' / 'subject'), -1 when there is none. */
function actCol(s, what) {
  s._ac = s._ac || {};
  if (s._ac[what] === undefined) {
    s._ac[what] = -1;
    var pats = ACT_COLS[what];
    for (var r = 0; r < pats.length && s._ac[what] < 0; r++)
      for (var i = 0; i < s.hk.length; i++)
        if (pats[r].test(s.hk[i]) && !(what === 'type' && s.hk[i] === 'activityid')) {
          s._ac[what] = i;
          break;
        }
  }
  return s._ac[what];
}

/** One row of the activities sheet → { date (Excel date number or null), type, subject, e (the row) }. */
function actInfo(e) {
  var s = S.sheets[e.s],
    g = function (what) {
      var c = actCol(s, what);
      return c < 0 ? null : cv(e.s, c, e.j);
    },
    d = num(g('date'));
  return {
    date: d != null && d > NEVER ? d : null,
    type: String(g('type') == null ? '' : g('type')).trim(),
    subject: String(g('subject') == null ? '' : g('subject')).trim(),
    e: e
  };
}

/** Is a cell "filled in" as a yes (not empty, no, false, 0)? */
function isYes(v) {
  if (v == null || v === false || v === 0) return false;
  return !/^(|no|n|false|0|-|none|null)$/i.test(String(v).trim());
}

/** The contact person's name column: fullname / contactname / contact / name, else any name column. */
function contactNameCol(s) {
  var keys = ['fullname', 'contactname', 'contact', 'name'];
  for (var i = 0; i < keys.length; i++) if (s.hk.indexOf(keys[i]) >= 0) return s.hk.indexOf(keys[i]);
  return nameCol(s);
}

/** The publication numbers found in the contact persons sheet(s): pslab_publication1, 2, 3 … → [1, 2, 3]
 *  (a column without a number counts as 1). Worked out once per load (S.pubNums). */
function pubNums() {
  if (S.pubNums) return S.pubNums;
  var n = {};
  S.sheets.forEach(function (s) {
    if (s.role !== 'contacts') return;
    s.hk.forEach(function (h) {
      var m = h.match(PUBLICATION_COL);
      if (m) n[+(m[1] || 1)] = 1;
    });
  });
  S.pubNums = Object.keys(n)
    .map(Number)
    .sort(function (x, y) {
      return x - y;
    });
  return S.pubNums;
}

/** The account's touchpoints:
 *   visitDate = last site visit (Excel date number) or null; visit = true when there was one (even without a date)
 *   visitWhy  = what the last site visit was (activity subject or the account column)
 *   pub       = { 1: [{ who, what }], 2: [...], … } - one entry per publication number (Pub 1, Pub 2 …)
 */
function touchpoints(a) {
  var t = { visit: false, visitDate: null, visitWhy: '', pub: {} };
  var seen = function (date, why) {
    t.visit = true;
    if (date != null && (t.visitDate == null || date > t.visitDate)) {
      t.visitDate = date;
      t.visitWhy = why;
    } else if (!t.visitWhy) t.visitWhy = why;
  };
  // site visit: an account column with "site visit" in its name (a date, or any yes) …
  Object.keys(FIELD).forEach(function (k) {
    var v = F(a, k);
    if (SITE_VISIT_COL.test(k) && isYes(v)) seen(typeof v === 'number' && v > NEVER ? v : null, pretty(k));
  });
  // … and every activity that says "site visit" (the latest one wins)
  a.activities.forEach(function (x) {
    if (SITE_VISIT_ACT.test(x.type) || SITE_VISIT_ACT.test(x.subject)) seen(x.date, x.subject || x.type);
  });
  // publications: each pslab_publicationN column of the account's contact persons is its own checkpoint
  pubNums().forEach(function (n) {
    t.pub[n] = [];
  });
  a.contacts.forEach(function (e) {
    var s = S.sheets[e.s],
      nc = contactNameCol(s);
    s.hk.forEach(function (h, c) {
      var m = h.match(PUBLICATION_COL);
      if (!m) return;
      var v = cv(e.s, c, e.j);
      if (!isYes(v)) return;
      t.pub[+(m[1] || 1)].push({
        who: nc < 0 ? '' : String(cv(e.s, nc, e.j) || ''),
        what: /^(yes|y|true|1|x)$/i.test(String(v).trim()) ? '' : String(v) // a plain "yes" has no details
      });
    });
  });
  return t;
}

/** "Person: text · Person" - the details of one publication checkpoint. */
function pubText(list) {
  return (list || [])
    .map(function (p) {
      return p.who && p.what ? p.who + ': ' + p.what : p.who || p.what;
    })
    .join(' · ');
}

/** The colour of an activity type (ACT_COLORS, else a fixed colour per type from ACT_OTHER_COLORS). */
function actColor(type) {
  var t = String(type || '');
  for (var i = 0; i < ACT_COLORS.length; i++) if (ACT_COLORS[i].re.test(t)) return ACT_COLORS[i];
  var h = 0;
  for (var j = 0; j < t.length; j++) h = (h * 31 + t.charCodeAt(j)) % 997;
  return ACT_OTHER_COLORS[h % ACT_OTHER_COLORS.length];
}

/** The project's owner (OWNER_COLS in core/config-js), '' when the projects sheet has no owner column. */
function projOwner(p) {
  var s = S.sheets[p.s];
  if (s._oc === undefined) {
    s._oc = -1;
    for (var r = 0; r < OWNER_COLS.length && s._oc < 0; r++)
      for (var i = 0; i < s.hk.length; i++)
        if (OWNER_COLS[r].test(s.hk[i])) {
          s._oc = i;
          break;
        }
  }
  var v = s._oc < 0 ? null : cv(p.s, s._oc, p.j);
  return v == null ? '' : String(v);
}

/** The project's date, as an Excel date number, or null. */
function projDate(p) {
  var s = S.sheets[p.s];

  for (var r = 0; r < PROJECT_DATE_COLS.length; r++) {
    for (var i = 0; i < s.hk.length; i++) {
      if (PROJECT_DATE_COLS[r].test(s.hk[i]) && !/^validat/.test(s.hk[i])) {
        var v = num(cv(p.s, i, p.j));

        if (v != null && v > NEVER) {
          return v;
        }

        // This column exists but is empty/invalid → try the next date column
        break;
      }
    }
  }

  return null;
}
function latestDate(list) {
  var m = null;
  list.forEach(function (o) {
    if (o.date != null && (m == null || o.date > m)) m = o.date;
  });
  return m;
}

/** Is this project left out by the "Without P0" or the "Real projects only" switch (maps 01 + 02)? */
function leftOut(o) {
  if (S.noP0 && o.ph === P0_PHASE) return true;
  return (
    S.clean &&
    PROJECT_EXCLUDE.some(function (e) {
      return S.px[e.k] && o[e.k];
    })
  );
}

/** The standard "left out" kinds (PROJECT_EXCLUDE off: 1). */
function defaultPx() {
  var px = {};
  PROJECT_EXCLUDE.forEach(function (e) {
    if (e.off) px[e.k] = 1;
  });
  return px;
}

/** Projects (all, or only the open ones) that are kept by the "Real projects only" switch. */
function keptProjects(a, openOnly) {
  return (openOnly ? a.open : a.pj).filter(function (o) {
    return !leftOut(o);
  });
}

function keptOpen(a) {
  return keptProjects(a, true);
}

function isInternal(o) {
  return INTERNAL_KINDS.some(function (k) {
    return o[k];
  });
}

/** Map 02: days since the last project. From the file; when it was empty there, from the kept projects' dates. */
function lastProjectDays(a) {
  if (!a.lpFromProj) return a.lastProject;
  var d = latestDate(keptProjects(a, false));
  return d == null ? null : Math.max(0, Math.round(todaySerial() - d));
}

/** Is this project open? (status column statecodename / status / state; no such column = open) */
function isOpenProject(p) {
  var st = cellBy(p.s, p.j, 'statecodename');
  if (st == null) st = cellBy(p.s, p.j, 'status');
  if (st == null) st = cellBy(p.s, p.j, 'statecode');
  if (st == null) return !['statecodename', 'status', 'statecode'].some(function (k) {
    return S.sheets[p.s].hk.indexOf(k) >= 0; // the column exists but is empty for this project: not open
  });
  return OPEN_STATUS.test(String(st).trim());
}

function uniq(a) {
  var o = {},
    r = [];
  a.forEach(function (x) {
    if (!o[x]) {
      o[x] = 1;
      r.push(x);
    }
  });
  return r;
}

function cellBy(si, j, key) {
  var s = S.sheets[si],
    c = s.hk.indexOf(hKey(key));
  return c < 0 ? null : cv(si, c, j);
}

function rowHasContent(s, j) {
  for (var c = 0; c < s.cols.length; c++) {
    if (s.hk[c] === 'accountid') continue;
    if (cv(s.si, c, j) != null) return true;
  }
  return false;
}
</script>
