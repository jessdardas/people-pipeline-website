<style>
/* ==========================================================================
   BASE: colours, fonts and things used everywhere (buttons, links, hints, loading)
   Change a colour here and it changes on the whole page.
   ========================================================================== */
:root {
  /* page - everything is grey and black, only the matrix has colour */
  --bg: #f4f4f4; /* page background (behind the cards) */
  --surface: #ffffff; /* cards, header, panels */
  --soft: #efefef; /* hover backgrounds, table headers */
  --line: #e0e0e0; /* borders and dividers */

  /* text */
  --text: #111111; /* main text */
  --text-soft: #555555; /* secondary text */
  --text-faint: #8a8a8a; /* labels, hints, counters */

  /* active things: selected service unit, active tab, buttons, filter counts */
  --accent: #111111;
  --accent-soft: #ededed;

  /* matrix: cells go from --heat-low (few accounts) to --heat-high (the most) */
  --heat-low: #eaf2fb; /* pastel blue, very light */
  --heat-high: #7ea7da; /* pastel blue, strongest */
  --heat-text: #16253b; /* the numbers in the cells */
  --heat-selected: #2d4f7c; /* border of the cell whose accounts are shown */
  --found: #ffd23f; /* the yellow glow after "show on map" / search */

  /* shapes */
  --radius: 6px; /* buttons, menus */
  --radius-lg: 8px; /* cards */
  --cell-radius: 3px; /* matrix cells (0 = square) */
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.16);
  --font: 'Plus Jakarta Sans', Inter, 'Helvetica Neue', Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}

input {
  font: inherit;
  color: inherit;
}

a {
  color: var(--accent);
}

input[type='checkbox'],
input[type='radio'] {
  accent-color: var(--accent);
}

/* push the next items to the right in a flex row */
.ml {
  margin-left: auto;
}

/* small grey text under titles */
.meta {
  color: var(--text-faint);
  font-size: 12px;
  margin-top: 3px;
}

.hint {
  color: var(--text-faint);
  font-size: 12px;
  margin: 14px 0 0;
}

/* primary button (Apply, Excel, PDF) */
.btn {
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 600;
  transition:
    filter 0.15s,
    transform 0.15s;
}
.btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

/* text links (clear, all, none, Cancel …) */
.lnk {
  font-size: 12px;
  color: var(--text-soft);
  text-decoration: underline;
  text-decoration-color: var(--line);
  text-underline-offset: 3px;
}
.lnk:hover {
  color: var(--accent);
  text-decoration-color: var(--accent);
}

/* main area */
main {
  padding: 24px 32px 70px;
}

/* "Reading the source file…" while loading, and "No accounts for this selection" */
.loading,
.empty {
  padding: 70px 20px;
  text-align: center;
  color: var(--text-soft);
  background: var(--surface);
  border: 1.5px dashed var(--line);
  border-radius: var(--radius-lg);
}
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 10px;
  vertical-align: -3px;
  border: 2.5px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.empty p {
  margin: 4px 0;
}
.empty-icon {
  font-size: 28px;
  margin-bottom: 6px;
}

/* the small message at the bottom of the screen */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  font-size: 12.5px;
  border-radius: 999px;
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 80;
  max-width: 90vw;
  animation: toast-in 0.25s ease-out;
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translate(-50%, 10px);
  }
}

@media (max-width: 760px) {
  main {
    padding-left: 16px;
    padding-right: 16px;
  }
}
</style>
