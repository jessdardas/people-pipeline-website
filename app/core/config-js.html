var OPEN_STATUS = /^open$/i;

//   - shown:    I.N., intercompany, excluded-from-pipeline and internal-owner projects (INTERNAL_KINDS) go in
//               the "other" column of map 01; No P2 projects stay in their phase column
// How a kind is recognised:
//   name  = matched in the project name (or the account name)
//   col   = a flag column of the projects sheet (column name in lower case, letters only, e.g. pslabnop2); the flag
//           counts when the cell is filled in and is not "no" / "false" / "0"
//   owner = matched in the project owner column (OWNER_COLS)
// off = left out by default (standard view: all of them). Switching "Real projects only" off shows every kind.
var PROJECT_EXCLUDE = [
  { k: 'inn', t: 'I.N.', name: /(^|[^a-z0-9])i\.\s?n(\.|(?![a-z0-9]))/i, off: 1 },
  { k: 'ico', t: 'Intercompany', name: /inter-?\s?company/i, off: 1 },
  // the file's columns: pslab_nop2 and pslab_excludingfrompipeline (TRUE / FALSE)
  { k: 'nop2', t: 'No P2', col: /nop2/, off: 1 },
  { k: 'rfp', t: 'Excluded from pipeline', col: /(remov|exclud).*pipeline/, off: 1 },
  // internal project owners (OwnerName column): a word of the name STARTS with one of these, so "CYBEL" also
  // matches "Cybelle …", "SAM" matches "Sam …" and "Sammy …", "PSLAB" matches the pslab-… teams.
  // To match a whole name only, write it in full with \b at the end, e.g. sam saad\b
  { k: 'own', t: 'Internal owner', owner: /\b(roland|cybel|roger|sam|dany daaboul|pslab)/i, off: 1 } // same names as INTERNAL_USERS
];

//   - the account's own owner is an internal PERSON (INTERNAL_USERS: Roland, Cybel(le), Roger, Sam(my), Dany Daaboul).
//     The service-unit team owners (pslab-london, pslab-beirut, …) are NOT internal users: in the file they own most
//     accounts (about 17,500 of 23,000), so they stay. (For PROJECT owners, PSLAB does count - see the 'own' kind.)

// Add 'inn' / 'ico' to ACCOUNT_EXCLUDE_KINDS to remove the accounts of those projects too.
var ACCOUNT_EXCLUDE_KINDS = ['own'];
var INTERNAL_USERS = /\b(roland|cybel|roger|sam|dany daaboul)/i;

  { re: /phone|call/i, bg: '#d8f1df', fg: '#22693a' }, // Phone call - green

  { bg: '#e8ecd2', fg: '#56611a' },
  { bg: '#e6e1f5', fg: '#463a8a' },
  { bg: '#f3e3d3', fg: '#7a4a1c' },
  { bg: '#dcefe6', fg: '#2c6650' },
