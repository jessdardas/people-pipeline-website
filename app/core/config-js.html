<script>
/* Settings you are most likely to change: service units, pipelines, buckets, app state */
// --- dates ---------------------------------------------------------------
var NEVER = 36600; // Excel dates on/before 1 Jan 2000 mean "never" in the query

var M = 30.4375; // days per month

// --- service units (the buttons at the top left) ---------------------------
// Order of the buttons. Units found in the file but not listed here are added at the end.
var UNIT_ORDER = [
  'amsterdam',
  'antwerp',
  'bologna',
  'london',
  'paris',
  'new york',
  'stuttgart',
  'beirut',
  'dubai',
  'core',
  'marine'
];

// Units shown together under one heading (k = id, t = label, units = members).
var GROUPS = [{ k: 'benelux', t: 'Benelux', units: ['amsterdam', 'antwerp'] }];

// --- pipelines (the dropdown at the top right) ------------------------------
// k = number found in the "pipeline" column, t = label, s = description in the menu.
var PIPES = [
  { k: 1, t: 'Pipeline 1', s: 'paid proposal all + pitch ≥ P1 + direct supply ≥ P3' },
  { k: 2, t: 'Pipeline 2', s: 'pitch = P0 + direct supply ≤ P2' },
  { k: 3, t: 'Pipeline 3', s: 'claims all' }
];

// --- matrix / filter buckets ----------------------------------------------
// Project phases = columns of map 01.
var PHASES = ['P0', 'P1', 'P2', 'P3', 'P4', 'P5'];

// Classifications that make up map 03 "No business".
var NB = ['past demand', 'met in', 'met out', 'contacted', 'not contacted'];

// Post-P1 value buckets: the edges (in €) and the label for each bucket (one more label than edges).
var VAL_EDGES = [5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000];

var VAL_LABELS = [
  '0–5k',
  '5k–10k',
  '10k–25k',
  '25k–50k',
  '50k–100k',
  '100k–250k',
  '250k–500k',
  '500k–1M',
  '1M+'
];

// Buckets for project counts and for the number of projects in the list.
var CNT_LABELS = ['0', '1', '2–3', '4–5', '6–10', '11–20', '21+'];

var PRJ_LABELS = ['None', '1', '2–5', '6–10', '11+'];

// --- map 01: open projects ------------------------------------------------------------
// Map 01 places every current-pipeline account under the phase(s) of its OPEN projects.
// A project is open when its status column (statecodename) matches this; a project sheet without a
// status column counts every project as open.
var OPEN_STATUS = /^open$/i;

// "Real projects only" (small switch above maps 01 and 02, ON by default) and its ▾ menu.
// Each kind of project below can be LEFT OUT (ticked in the ▾ menu) or SHOWN:
//   - left out: the project does not count; an account whose projects are all left out leaves the map
//   - shown:    I.N., intercompany, excluded-from-pipeline and internal-owner projects (INTERNAL_KINDS) go in
//               the "other" column of map 01; No P2 projects stay in their phase column
// How a kind is recognised:
//   name  = matched in the project name (or the account name)
//   col   = a flag column of the projects sheet (column name in lower case, letters only, e.g. pslabnop2); the flag
//           counts when the cell is filled in and is not "no" / "false" / "0"
//   owner = matched in the project owner column (OWNER_COLS)
// off = left out by default (standard view: all of them). Switching "Real projects only" off shows every kind.
var PROJECT_EXCLUDE = [
  { k: 'inn', t: 'I.N.', name: /(^|[^a-z0-9])i\.\s?n(\.|(?![a-z0-9]))/i, off: 1 },
  { k: 'ico', t: 'Intercompany', name: /inter-?\s?company/i, off: 1 },
  // the file's columns: pslab_nop2 and pslab_excludingfrompipeline (TRUE / FALSE)
  { k: 'nop2', t: 'No P2', col: /nop2/, off: 1 },
  { k: 'rfp', t: 'Excluded from pipeline', col: /(remov|exclud).*pipeline/, off: 1 },
  // internal project owners (OwnerName column): a word of the name STARTS with one of these, so "CYBEL" also
  // matches "Cybelle …", "SAM" matches "Sam …" and "Sammy …", "PSLAB" matches the pslab-… teams.
  // To match a whole name only, write it in full with \b at the end, e.g. sam saad\b
  { k: 'own', t: 'Internal owner', owner: /\b(roland|cybel|roger|sam|dany daaboul|pslab)/i, off: 1 }
];
var INTERNAL_KINDS = ['inn', 'ico', 'rfp', 'own']; // shown → the "other (i.n. ...)" column on map 01

// The project owner column of the projects sheet (column names in lower case, letters only): the first of these
// patterns that matches a column wins ("project owner" before any other column with "owner" in its name).
var OWNER_COLS = [/projectowner/, /owner/];

// "Without P0" switch (just above "Real projects only", ON by default): P0 projects are left out on maps 01 and 02
// (the P0 column disappears; an account whose projects are all P0 leaves the map).
var P0_PHASE = 'P0';

// Project date used when an account's "last project" date is empty: per project, the first of these columns that is
// filled in (datein, else actualclosedate).
var PROJECT_DATE_COLS = [/datein/, /actualclosedate/];
// --- Stay in touch policy (second view of the account list under the maps, app/touch/) ---------------
// The "activities" sheet of the Excel file (one row per activity). Its columns are found by name (lower case,
// letters only); for each, the first pattern that matches a column wins.
var ACT_COLS = {
  date: [/actualend/, /actualstart/, /scheduledstart/, /scheduledend/, /^(date|activitydate)$/, /date/, /createdon/],
  type: [/^activitytype/, /activitytypecode/, /^type$/, /type/, /category/],
  subject: [/^subject$/, /subject/, /title/, /description/, /name$/]
};
// Activities of these types are not shown anywhere (type or, without a type, subject).
var ACT_HIDE = /\btasks?\b/i;
// Colour of each activity type (first match wins); other types get a colour from ACT_OTHER_COLORS.
var ACT_COLORS = [
  { re: /meeting|appointment/i, bg: '#d6e4fb', fg: '#1f4f9a' },
  { re: /phone|call/i, bg: '#d8f1df', fg: '#22693a' },
  { re: /e-?mail/i, bg: '#fdecc8', fg: '#8a5a00' },
  { re: /site\s*-?\s*visit|visit/i, bg: '#ead9f7', fg: '#6a2f97' },
  { re: /letter|post|mail/i, bg: '#f9dad7', fg: '#9b2c22' }
];
var ACT_OTHER_COLORS = [
  { bg: '#d4f0f0', fg: '#1d6363' },
  { bg: '#f6dcec', fg: '#8c2c66' },
  { bg: '#e8ecd2', fg: '#56611a' },
  { bg: '#e6e1f5', fg: '#463a8a' }
];
// The weeks shown: this many weeks before and after this week.
var WEEKS_BEFORE = 5;
var WEEKS_AFTER = 10;
// Touchpoints (read-only tick boxes):
//   site visit = the latest date of: an account column with "site visit" in its name, or an activity whose type or
//                subject says "site visit"
//   Pub 1, Pub 2, Pub 3 … = the contact person columns pslab_publication1, 2, 3 … - each one its own tick box,
//                ticked when it is filled in (not no/false/0) for at least one contact person of the account
var SITE_VISIT_COL = /sitevisit/;
var SITE_VISIT_ACT = /site\s*-?\s*visit/i;
var PUBLICATION_COL = /^pslabpublication(\d*)$/;

// --- app state (what is selected right now) - changed by the app, not by hand ---
// units/pipes = selected service units / pipelines (empty = all),
// view = which map tab (1-4), F / SF = filters, g = the account table (sort, column filters, search).
var S = {
  sheets: [],
  acc: [],
  byId: {},
  source: {},
  checked: 0,
  units: [],
  pipes: [1], // map 01 opens on Pipeline 1 (empty = all pipelines)
  clean: true, // "Real projects only" switch (maps 01 + 02)
  px: {}, // which PROJECT_EXCLUDE kinds that switch leaves out (filled from their "off" setting in build())
  noP0: true, // "Without P0" switch (maps 01 + 02)
  xm: false, // its small menu is open
  dbFrom: '', // New DB: a date picked for this view only (not saved); '' = the admin date
  view: 1,
  db: 'pipeline', // 'pipeline' = everything, 'newdb' = only accounts validated on or after settings.newDbFrom
  settings: { newDbFrom: '2026-07-01' }, // shared settings from the server (admin panel)
  owners: [], // owners picked under the service units (empty = all owners)
  listView: 'list', // the account list under the maps: 'list' = Account listing, 'touch' = Stay in touch policy
  tpCols: false, // Account listing: show the touchpoint columns (Last site visit, Pub 1, Pub 2 …) - off by default
  tpOpen: null, // Stay in touch policy: the account whose touchpoints pop-up is open (account index)
  pickMode: false, // "check to export" is ticked: tick boxes in the # column of the account table
  pick: {}, // the accounts ticked for export (account id = 1); kept until "clear" or the page is closed
  sel: [], // selected matrix cells ("row§column"); their accounts are listed under the matrix
  multiCell: false, // "select several" boxes in the matrix
  F: {},
  social: 'all',
  SF: {},
  cell: null,
  list: [],
  listMeta: '',
  detail: null,
  hl: null,
  g: { sort: { k: 'lm', d: 1 }, cf: {}, q: '', limit: 100 },
  multiUnit: false,
  pm: false,
  pop: null,
  busy: false
};
</script>
